# vshop C 端商城 + Vendure 后台 - e.joho.cn（第一个租户）
# 在 1Panel 中创建静态网站 e.joho.cn 后，将此配置粘贴到网站 Nginx 配置中
#
# 架构说明：
#   - e.joho.cn 同时托管 vshop 前端静态文件 + Vendure 全端点反向代理
#   - Vendure 主端口 3020，所有端点挂在此端口（见启动日志）：
#       Shop API:      /shop-api
#       Admin API:     /admin-api
#       Admin UI:      /admin          （后台管理页面）
#       Dashboard:     /dashboard
#       GraphiQL:      /graphiql/admin , /graphiql/shop
#       Asset server:  /assets
#       Mailbox:       /mailbox        （开发邮箱模拟）
#   - 前端 VITE_API_URL=https://e.joho.cn，请求 /shop-api → Vendure
#   - 租户解析：前端 resolveChannelByDomain(host=e.joho.cn) 走 /shop-api，
#     需在 Vendure 中配置 channel 的 domain=e.joho.cn 映射
#   - X-Forwarded-Host 用 $host 而非 $server_name，保证回调 URL 正确
# ============ HTTP → HTTPS 跳转 ============
# 登录/验证码与 GraphQL 泛洪保护（Phase1，按客户端 IP 的宽松限流）
# login/验证码为 GraphQL mutation，网关无法按路径区分；登录失败次数由应用内 login-rate-limit 中间件按 IP+账号精确控制
limit_req_zone $binary_remote_addr zone=api_rl:20m rate=50r/s;
limit_req_status 429;

server {
    listen 80 ; 
    server_name e.joho.cn; 
    index index.php index.html index.htm default.php default.htm default.html; 
    proxy_set_header Host $host; 
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
    proxy_set_header X-Forwarded-Host $server_name; 
    proxy_set_header X-Real-IP $remote_addr; 
    proxy_http_version 1.1; 
    proxy_set_header Upgrade $http_upgrade; 
    proxy_set_header Connection $http_connection; 
    access_log /www/sites/e.joho.cn/log/access.log main; 
    error_log /www/sites/e.joho.cn/log/error.log; 
    # ACME 校验（保留，保证证书续期）
    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }
    root /www/sites/e.joho.cn/index; 
    error_page 404 /404.html; 
    # 测试阶段：http 直连商品图片（浏览器/node 不信企业证书，不走 301 跳转）
    location /assets {
        proxy_pass http://127.0.0.1:3020/assets;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # 其余请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri; 
    }
}
# ============ HTTPS 主站点 ============
server {
    listen 443 ssl ; 
    server_name e.joho.cn; 
    index index.php index.html index.htm default.php default.htm default.html; 
    # SSL 证书（1Panel 实际路径）
    ssl_certificate /www/sites/e.joho.cn/ssl/e.joho.cn.pem; 
    ssl_certificate_key /www/sites/e.joho.cn/ssl/e.joho.cn.key; 
    ssl_protocols TLSv1.2 TLSv1.3; 
    ssl_ciphers HIGH:!aNULL:!MD5; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m;
    proxy_set_header X-Forwarded-Proto $scheme; 
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # 全局统一代理头
    proxy_set_header Host $host; 
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
    proxy_set_header X-Forwarded-Host $server_name; 
    proxy_set_header X-Real-IP $remote_addr; 
    proxy_http_version 1.1; 
    proxy_set_header Upgrade $http_upgrade; 
    proxy_set_header Connection $http_connection; 
    access_log /www/sites/e.joho.cn/log/access.log main; 
    error_log /www/sites/e.joho.cn/log/error.log; 
    # ACME 校验
    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }

    # 后端故障兜底：502/503/504 统一展示维护页（不缓存，带 Retry-After）
    error_page 502 503 504 =503 @maintenance;
    location @maintenance {
        internal;
        root /www/sites/e.joho.cn/index;
        try_files /maintenance.html =503;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
    }
    # ============ Vendure API / 后台 / 资源 反向代理 ============
    # Shop API（前端所有业务请求）
    location /shop-api {
        limit_req zone=api_rl burst=200 nodelay;
        proxy_pass http://127.0.0.1:3020/shop-api; 
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; 
        proxy_send_timeout 300s; 
        client_max_body_size 100m; 
    }
    # Admin API（后台数据接口）
    # 选品调研 / 预售候选只读接口（shao C 端跨域调用）
    # CORS 由 Vendure(Express) 自身处理：Origin 反射 + credentials + vendure-token 预检
    location /product-survey {
        proxy_pass http://127.0.0.1:3020/product-survey;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /merchant-api {
        proxy_pass http://127.0.0.1:3020/merchant-api;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }
    location /admin-api {
        limit_req zone=api_rl burst=200 nodelay;
        proxy_pass http://127.0.0.1:3020/admin-api; 
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; 
        proxy_send_timeout 300s; 
        client_max_body_size 100m; 
    }
    # Admin UI（后台管理页面，含 WebSocket 升级）
    location /admin {
        proxy_pass http://127.0.0.1:3020/admin; 
        proxy_read_timeout 300s; 
        proxy_send_timeout 300s; 
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection "upgrade"; 
    }
    # Dashboard（如有使用）
    # 注意：proxy_pass 不带路径，原样转发 /dashboard/... 到 Vendure，
    # 否则 dashboard 的 assets 资源会 404
    location /dashboard {
        proxy_pass http://127.0.0.1:3020; 
        proxy_read_timeout 300s; 
        proxy_send_timeout 300s; 
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection "upgrade"; 
    }
    # GraphiQL 调试工具
    location /graphiql/ {
        proxy_pass http://127.0.0.1:3020/graphiql/; 
        proxy_read_timeout 300s; 
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection "upgrade"; 
    }
    # Asset server 与前端构建产物共用 /assets 路径：
    #   前端产物优先本地（root 指向站点目录），未命中再回退到 Vendure 商品图片
    location /assets {
        root /www/sites/e.joho.cn/index; 
        try_files $uri @vendure; 
    }
    # Dev mailbox（开发邮箱模拟，生产可删除）
    location /mailbox {
        proxy_pass http://127.0.0.1:3020/mailbox; 
        proxy_read_timeout 300s; 
    }
    # ============ vshop 前端静态文件 ============
    # 前端静态资源优先，未命中回退到 Vendure
    location /static/ {
        root /www/sites/e.joho.cn/index; 
        try_files $uri @vendure; 
    }
    location @vendure {
        proxy_pass http://127.0.0.1:3020; 
    }
    # ============ 医生工作台 /workbench（H5 静态）============
    # index.html 每次强校验（避免发新版后命中旧 HTML）；资源按 hash 文件名可长缓存
    location = /workbench/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ^~ /workbench/ {
        root /www/sites/e.joho.cn/index;
        try_files $uri $uri/ /workbench/index.html;
    }

    # ============ 手机管理后台 /guanli ============
    # A1（2026-11-06）：仅加防点击劫持 / 强制 HTTPS 三个头，未加 script-src/style-src 白名单
    # 注意：子 location 里只要出现 add_header，父级 add_header 不再继承，故各层显式重复
    location /guanli/ {
        alias /www/sites/e.joho.cn/guanli/;
        try_files $uri $uri/ /guanli/index.html;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location = /guanli/index.html {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    # 使用手册 html 必须每次强校验（避免浏览器缓存旧空白版）；同目录图片可短缓存
    # ^~ 前缀优先匹配，避免被下方 location / 或正则影响
    location ^~ /guanli/static/manual/ {
        alias /www/sites/e.joho.cn/guanli/static/manual/;
        # A4（2026-11-06）：整个手册前缀（含截图/封面/脚本）只给内部 staff，basic auth；凭据不入仓库
        auth_basic "JOHO staff manual";
        auth_basic_user_file /www/sites/e.joho.cn/log/.manual_htpasswd;
        location ~ \.html?$ {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location ~ \.(png|jpe?g|gif|webp|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
    }

    location = /guanli { return 302 /guanli/; }
    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html; 
    }
    root /www/sites/e.joho.cn/index; 
    error_page 404 /404.html; 
}
