# e.joho.cn — /guanli/ 安全相关片段（参考基线）
#
# 本文件是「片段/参考基线」，不是可整体替换的完整站点配置：
#   生效位置为服务器 openresty 容器内 /usr/local/openresty/nginx/conf/conf.d/e.joho.cn.conf
#   （宿主机 /opt/1panel/apps/openresty/openresty/conf/conf.d/e.joho.cn.conf）
#   reload：docker exec 1Panel-openresty-3I6S nginx -t && docker exec 1Panel-openresty-3I6S nginx -s reload
# 完整站点配置（证书、反代、静态站点等）仍以服务器为准，此处仅摘出 2026-11-06 的 A1/A4 片段存档。
#
# A1（2026-11-06）：/guanli/ 增加防点击劫持与强制 HTTPS 三个响应头
#   X-Frame-Options: DENY
#   Content-Security-Policy: frame-ancestors 'none'
#   Strict-Transport-Security: max-age=31536000
#   未加 script-src / style-src 白名单（会把 Vue 应用打坏）；如需完整 CSP 先走 report-only 方案。
#
# A4（2026-11-06）：/guanli/static/manual/ 整个前缀加 basic auth（HTML、截图、封面、内嵌 JS 全覆盖）
#   凭据文件在服务器 /www/sites/e.joho.cn/log/.manual_htpasswd（权限 600），
#   由运维签发与轮换；账号密码与 htpasswd 内容不进仓库。
#
# 注意：子 location 内只要出现 add_header，父级 add_header 就不再继承，故各层显式重复三个安全头。

# ============ 手机管理后台 /guanli ============
location /guanli/ {
    alias /www/sites/e.joho.cn/guanli/;
    try_files $uri $uri/ /guanli/index.html;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /guanli/index.html {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ============ 操作手册（整个前缀要求内部凭据） ============
# ^~ 前缀优先匹配，避免被下方 location / 或正则影响
location ^~ /guanli/static/manual/ {
    alias /www/sites/e.joho.cn/guanli/static/manual/;
    auth_basic "JOHO staff manual";
    auth_basic_user_file /www/sites/e.joho.cn/log/.manual_htpasswd;
    location ~ \.html?$ {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ \.(png|jpe?g|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

location = /guanli { return 302 /guanli/; }
