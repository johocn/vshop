<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>youshop 使用手册</title>
<style>
:root{
  --brand:#1a56db; --brand2:#1e40af; --bg:#f5f6fa; --ink:#303133; --muted:#909399;
  --rule:#e4e7ed; --mark:#fef08a; --mark-ink:#92400e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;font-size:15px;line-height:1.75;color:var(--ink);background:var(--bg)}
[hidden]{display:none!important}

/* ===== App header ===== */
.app-header{position:sticky;top:0;z-index:80;background:var(--brand);color:#fff;box-shadow:0 2rpx 10rpx rgba(0,0,0,.08)}
.header-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px}
.app-header .back{font-size:22px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.app-header h1{flex:1;margin:0;font-size:17px;font-weight:700;text-align:center;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header .ibtn{font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px}
.app-header .ibtn:active{background:rgba(255,255,255,.18)}

.page{max-width:720px;margin:0 auto;padding:14px 14px 40px}

/* ===== Home ===== */
.cover{margin:-14px -14px 16px;background:linear-gradient(135deg,#fff,#f3ede2)}
.cover img{width:100%;display:block;max-height:200px;object-fit:cover}
.cover .cap{padding:14px 16px 16px}
.cover h2{margin:0 0 4px;font-size:20px;font-weight:800;color:#211a14}
.cover p{margin:0;font-size:13px;color:#6c6357}
.search-entry{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:11px 14px;margin-bottom:14px;color:var(--muted);font-size:14px;cursor:pointer}
.search-entry:active{background:#f0f2f7}
.search-entry .si{color:var(--brand)}

.book-card{position:relative;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:14px;cursor:pointer;overflow:hidden}
.book-card:active{background:#fafbff}
.book-card .rk{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brand)}
.book-card .bt{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.book-card .bt .bn{font-size:16px}
.book-card .bd{font-size:13px;color:var(--muted);margin-top:6px}
.book-card .badge{font-size:11px;color:var(--brand);background:rgba(26,86,219,.08);border-radius:999px;padding:1px 8px;font-weight:600}
.book-card .go{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#c0c4cc;font-size:18px}
.side-note{font-size:12px;color:#b0b3b9;text-align:center;margin-top:24px;padding:0 16px}

/* ===== Reader ===== */
.reader{background:#fff;border-radius:14px;padding:18px 16px;border:1px solid var(--rule)}
.reader h2{font-size:22px;font-weight:800;margin:0 0 14px;color:var(--ink);line-height:1.35}
.reader h3{font-size:17px;font-weight:700;margin:22px 0 8px;color:var(--ink);border-left:4px solid var(--brand);padding-left:10px}
.reader h4{font-size:15px;font-weight:700;margin:16px 0 6px}
.reader p{margin:0 0 12px;color:#4b5157}
.reader ul,.reader ol{padding-left:22px;margin:10px 0}
.reader li{margin:5px 0}
.reader .lead{color:var(--muted)}
.reader code{font-family:Consolas,Menlo,monospace;font-size:.86em;background:#f2f4f9;color:var(--brand2);padding:2px 6px;border-radius:5px}
.reader pre{overflow-x:auto;background:#1e2233;color:#e6e9f2;border-radius:10px;padding:14px;font-size:12.5px;line-height:1.6;margin:12px 0;white-space:pre-wrap;word-break:break-word}
.reader pre code{background:none;color:inherit;padding:0}
.reader table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.reader th,.reader td{border:1px solid #dcdfe6;padding:7px 9px;vertical-align:top;text-align:left;word-break:break-word}
.reader th{background:#f5f7fa;font-weight:700}
.reader blockquote{border-left:4px solid #dcdfe6;background:#fafbfc;margin:12px 0;padding:10px 14px;color:#80848a;border-radius:0 8px 8px 0}
.reader blockquote p{margin:0}
.reader mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}
.reader .mark{background:none;color:var(--brand);font-weight:700}
.reader .note,.reader .warn,.reader .tip{border-radius:10px;padding:11px 14px;margin:12px 0;font-size:13.5px;overflow-wrap:break-word}
.reader .note{background:#eff6ff;border:1px solid #bfdbfe}
.reader .warn{background:#fff7ed;border:1px solid #fed7aa}
.reader .tip{background:#ecfdf5;border:1px solid #a7f3d0}
.reader .note b,.reader .warn b,.reader .tip b{white-space:nowrap}
.reader .card{background:#fafbff;border:1px solid #eef0f6;border-radius:10px;padding:12px 14px;margin:10px 0}
.reader .card b{color:var(--brand2)}
.reader .steps{list-style:none;counter-reset:st;padding:0;margin:12px 0}
.reader .steps li{counter-increment:st;position:relative;padding:6px 0 6px 40px;margin:0}
.reader .steps li::before{content:counter(st);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.reader .img{display:block;width:100%;border:1px solid var(--rule);border-radius:10px;margin:12px 0;cursor:zoom-in}
.reader .imgcap{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 12px}
.reader .imgrow{display:flex;gap:12px;margin:12px 0}.reader .imgrow>div{flex:1;min-width:0}.reader .imgrow .img{width:100%;margin:0}
.reader .flow{background:#fafafa;border:1px solid #eef0F6;border-radius:10px;padding:14px;margin:12px 0;overflow-x:auto}
.reader .frow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin:6px 0;text-align:center}
.reader .fnode{background:#fff;border:1px solid #dcdfe6;border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink);text-align:center;min-width:90px}
.reader .fnode.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.reader .farrow{color:#c0c4cc;font-size:16px;white-space:nowrap}
.reader .fphase{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--brand);font-weight:700;margin:8px 0 2px}
.reader details{background:#fafbfc;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin:10px 0}
.reader summary{cursor:pointer;font-weight:700;font-size:14px}
.reader details[open] summary{color:var(--brand);margin-bottom:8px}

/* ===== Doc nav ===== */
.doc-nav{display:flex;gap:10px;margin-top:14px}
.doc-nav .navbtn{flex:1;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-align:center;font-size:13px;color:#4b5157;cursor:pointer}
.doc-nav .navbtn:active{background:#f0f2f7}
.doc-nav .navbtn.next{color:var(--brand);border-color:#c9d7f7;background:#f5f8ff}

/* ===== Search ===== */
.search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:4px 12px;margin-bottom:12px}
.search-bar input{flex:1;border:none;outline:none;padding:10px 0;font-size:14px;background:none;color:var(--ink)}
.search-bar .clear{color:#c0c4cc;font-size:18px;cursor:pointer;padding:4px}
.empty-hint{padding:80px 0;text-align:center;color:var(--muted);font-size:13px}
.result-count{font-size:12px;color:var(--muted);margin-bottom:10px}
.result-item{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.result-item:active{background:#fafbff}
.result-title{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px}
.result-snippet{font-size:13px;color:#5a6066;line-height:1.6;margin-bottom:5px}
.result-snippet mark,.result-title mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}
.result-path{font-size:11px;color:#c0c4cc;font-family:monospace}
.result-book{display:inline-block;font-size:10px;color:var(--brand);background:rgba(26,86,219,.08);border-radius:999px;padding:1px 7px;margin-right:6px;font-weight:600}

/* ===== TOC float ===== */
.toc-float{position:fixed;right:16px;bottom:34px;width:52px;height:52px;border-radius:15px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;box-shadow:0 6px 20px rgba(26,86,219,.35);z-index:100;cursor:pointer}
.toc-float:active{background:var(--brand2)}
.toc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;display:flex;align-items:flex-end}
.toc-panel{width:100%;max-width:720px;margin:0 auto;max-height:66vh;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.toc-panel .toc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule)}
.toc-panel .toc-head .t{font-size:16px;font-weight:700}
.toc-panel .toc-head .c{font-size:18px;color:var(--muted);cursor:pointer;padding:4px}
.toc-panel .toc-list{flex:1;overflow-y:auto;padding:8px 0;max-height:50vh}
.toc-item{padding:12px 20px;font-size:14px;color:#4b5157;border-left:4px solid transparent;cursor:pointer}
.toc-item.on{color:var(--brand);font-weight:700;border-left-color:var(--brand);background:#f5f8ff}
.toc-item .toc-book{font-size:11px;color:#b0b3b9;display:block}

.footerbar{text-align:center;color:#b0b3b9;font-size:12px;margin-top:26px;padding-top:14px;border-top:1px solid #eef0f6}
img:fullscreen{object-fit:contain;background:#fff}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <span class="back" id="btnBack" hidden>‹</span>
    <h1 id="appTitle">youshop 使用手册</h1>
    <span class="ibtn" id="btnSearch" title="搜索">🔍</span>
    <span class="ibtn" id="btnMenu" title="目录">≡</span>
  </div>
</header>

<!-- HOME -->
<section id="viewHome" class="page">
  <div class="cover">
    <img src="cover.jpg" alt="youshop 使用手册">
    <div class="cap"><h2>youshop 使用手册</h2><p>商家 / 运营 / 平台一站式指南：含入驻、审批、装修、商品、下单拆单全流程。</p></div>
  </div>
  <div class="search-entry" id="goSearchHome"><span class="si">🔍</span>搜索文档…</div>
  <div id="bookList"></div>
  <div class="side-note">本手册公开共享，无需登录即可访问；内容随产品持续更新。</div>
</section>

<!-- READER -->
<section id="viewReader" class="page" hidden>
  <div class="reader" id="readerContent"></div>
  <div class="doc-nav">
    <div class="navbtn" id="btnPrev">‹ 上一章</div>
    <div class="navbtn next" id="btnNext">下一章 ›</div>
  </div>
  <div class="footerbar" id="readerFoot"></div>
</section>

<!-- SEARCH -->
<section id="viewSearch" class="page" hidden>
  <div class="search-bar">
    <span>🔍</span>
    <input id="searchInput" type="text" placeholder="输入关键词搜索…" autocomplete="off">
    <span class="clear" id="searchClear" hidden>×</span>
  </div>
  <div class="empty-hint" id="searchEmpty">输入关键词开始搜索</div>
  <div id="searchResults"></div>
</section>

<div class="toc-float" id="tocFloat" hidden>≡</div>

<div class="toc-overlay" id="tocOverlay" hidden>
  <div class="toc-panel">
    <div class="toc-head"><span class="t">目录</span><span class="c" id="tocClose">✕</span></div>
    <div class="toc-list" id="tocList"></div>
  </div>
</div>

<script>
/* ============ 手册数据 ============ */
var BOOKS = {
  op: { id:'op', title:'youshop 租户运营手册', short:'运营手册', icon:'🏪',
        desc:'开店、绑定域名、装修首页、上架商品、处理订单的日常运营指南。' },
  mp: { id:'mp', title:'商户入驻与商品上架审批流程', short:'入驻审批', icon:'📋',
        desc:'平台建商户 → 商户提交商品 → 审批上架 → 真实下单拆单验证。' },
  cx: { id:'cx', title:'nshop 商城 C 端手册', short:'C端手册', icon:'📱',
        desc:'nshop 商城买家视角：结账本地化、逐箱结算、订单确认与售后。' }
};

var CHAPTERS = [
{book:'op', id:'op-1', title:'这是一本什么手册', html:`
<p class="lead">youshop 是一个基于 Vendure 的 <span class="mark">多租户 C 端商城</span>：一个平台服务多个商家（租户），每个租户拥有独立的域名、店铺装修、商品与订单，数据相互隔离。</p>
<p>本手册站在<strong>租户运营者</strong>视角，带你走完从「拿到店铺」到「日常运营」的全流程。你无需了解后端技术——只需在管理后台配置，前端商城会<mark class="mark">自动按你的配置渲染</mark>。</p>
<div class="note"><b>页面路径：</b>以租户域名 <code>https://e.joho.cn</code> 为例。你在后台的所有配置，最终通过 <code>/shop-api</code> 下发给商城页面，租户由访问域名自动识别。</div>
<h3>这本手册会带你掌握</h3>
<div class="card"><b>开店</b> —— 开通租户、绑定域名，让商城「跑起来」。</div>
<div class="card"><b>装修</b> —— 用首页组件与主题，搭建自己的品牌门面。</div>
<div class="card"><b>经营</b> —— 商品、价格、库存、订单与售后，一整套日常运营。</div>
<div class="warn"><b>约定：</b>手册中的「后台」均指管理后台（Admin）界面；「商城」指你的租户向用户展示的 C 端 H5 页面。</div>
<h3>后台多语言</h3>
<p>管理后台支持 <span class="mark mark-blue">简体中文</span> 与 <span class="mark">English</span> 双语，文案已<mark class="mark">覆盖登录、选店、工作台、商品、订单、库存、装修、营销、配送支付、平台系统等全部页面</mark>。语言偏好本地持久化（保存在本机 <code>wa_locale</code>），下次登录沿用，无需重复设置。金额、数量、编码等数据不随语言翻译，仅界面文案双语。</p>
<div class="imgrow">
  <div><img class="img" src="shots/i18n_login_zh.png" alt="登录页-简体中文"><div class="imgcap">图 1-1 · 简体中文登录页</div></div>
  <div><img class="img" src="shots/i18n_login_en.png" alt="登录页-English"><div class="imgcap">图 1-2 · English 登录页</div></div>
</div>`},
{book:'op', id:'op-2', title:'认识多租户商城', html:`
<p class="lead">先理解你的店铺在整体架构里的位置，后面的配置就会顺理成章。</p>
<h3>整体架构</h3>
<div class="flow">
  <div class="frow"><span class="fnode">买家</span><span class="farrow">→</span><span class="fnode primary">C端商城</span><span class="farrow">→ /shop-api</span><span class="fnode">Vendure 后端<br/>商品/订单/库存</span></div>
  <div class="frow"><span class="fnode primary">租户运营者</span><span class="farrow">→</span><span class="fnode">管理后台 Admin</span><span class="farrow">→</span><span class="fnode">Vendure 后端</span></div>
</div>
<h3>核心概念</h3>
<div class="card"><b>Channel（渠道 = 你的店铺）</b><br/>Vendure 用 Channel 隔离不同租户，商品、订单、会员都归属其中，<mark class="mark">互不影响</mark>。</div>
<div class="card"><b>域名绑定</b><br/>每个 Channel 绑定一个访问域名，系统根据买家访问域名自动「认领」到对应租户（<code>resolveChannelByDomain</code>）。</div>
<div class="card"><b>通道主题 themeId</b><br/>每个 Channel 有主题标识（如 <code>taobao-orange</code>），商城用它切换整体配色与风格。</div>
<div class="card"><b>展示模板 displayTemplate</b><br/>每个商品可选展示模板（如 <code>standard</code>），控制商品详情页版式，承载不同营销展示。</div>
<div class="tip"><b>一句话：</b>你是「租户」→ 在后台是「一个 Channel」→ 买家看到的是「绑定你域名的一套商城」。</div>`},
{book:'op', id:'op-3', title:'开通并绑定你的店铺', html:`
<p class="lead">上架任何内容之前，先确保你的店铺能被正确访问、且归属准确的租户。</p>
<h3>开通 CheckList</h3>
<ol class="steps">
  <li><b>分配租户账号</b>：由平台为你开通运营账号与对应 Channel，并告知店铺标识（Channel token）与后台地址。</li>
  <li><b>绑定独立域名</b>：将你的域名解析到商城入口，并在平台侧登记该域名到你名下。</li>
  <li><b>配置域名映射</b>：在后台 Channel 设置中填写访问域名（如 <code>e.joho.cn</code>），买家访问时系统通过 <code>resolveChannelByDomain</code> 自动认领。</li>
  <li><b>指定主题与默认页</b>：给 Channel 设置 <code>themeId</code> 与首页配置，商城即可按品牌风格渲染。</li>
</ol>
<div class="flow">
  <div class="frow"><span class="fnode">平台开通 Channel<br/>设定域名字段</span><span class="farrow">→</span><span class="fnode">域名解析</span><span class="farrow">→</span><span class="fnode">后台填入域名</span></div>
  <div class="frow"><span class="farrow">↑</span></div>
  <div class="frow"><span class="fnode">买家访问域名</span><span class="farrow">→</span><span class="fnode primary">命中?命中→你的商城<br/>未配置→回退默认租户</span></div>
</div>
<div class="warn"><b>常见坑：</b>买家打开域名却显示「默认风」，大概率是<mark class="mark">Channel 域名映射没填/填错</mark>，系统没认领到你的租户。</div>`},
{book:'op', id:'op-4', title:'登录管理后台', html:`
<p class="lead">所有店铺配置都在管理后台完成，它和买家看到的商城是两回事。</p>
<div class="card"><b>后台地址</b><br/>平台的 Admin UI 入口（如 <code>https://e.joho.cn/guanli</code>），运营者专用，买家看不到。</div>
<div class="card"><b>账号与权限</b><br/>用平台分配的账号登录，请<mark class="mark">妥善保管凭据</mark>，必要时可按角色申请只读/编辑权限。</div>
<div class="card"><b>多店铺切换</b><br/>登录后如持有多个店铺（Channel），先进入「选择要经营的店铺」页，选中所经营的店铺后进入工作台；后续请求均以该店铺上下文为准。</div>
<img class="img" src="shots/op_dashboard.png" alt="工作台-店铺上下文与功能入口">
<div class="imgcap">图 W0 · 登录并选定店铺后的工作台（顶部显示当前店铺上下文）</div>
<div class="note"><b>安全提示：</b>后台仅管理员可访问；商城面向买家完全公开。若媒体文件（视频/PDF）被误开放，可能是走错了鉴权通道。</div>`},
{book:'op', id:'op-4b', title:'返回、退出与手机端导航', html:`
<p class="lead">后台是按「<mark class="mark">手机端操作</mark>」设计的：任意子页都能<mark class="mark">一步回工作台</mark>；只有在工作台再点返回，才会询问是否退出，避免误触登出。</p>
<h3>左上角「←」按钮</h3>
<div class="card"><b>在子页（订单、商品、库存、装修…）</b><br/>点「←」<mark class="mark">直接回到工作台</mark>，不再逐级回退上一页；从更深的多层页面（如「订单 → 数据看板」）返回同样一步到工作台。</div>
<div class="card"><b>在工作台</b><br/>再点「←」弹出「<b>离开后台</b>：要返回登录页并退出当前账号吗？」确认框：点「取消」留在工作台，点「退出」回到登录页。</div>
<div class="card"><b>从子页返回工作台时不会弹窗</b><br/>只有「<mark class="mark">站在工作台上按返回</mark>」才视为退出意愿；子页返回落到工作台属于正常页面切换，不打扰。</div>
<div class="card"><b>浏览器返回键同理</b><br/>在子页按浏览器返回 → 落回工作台（无弹窗）；在工作台按浏览器返回 → 弹出退出确认，取消后仍停在工作台。</div>
<div class="card"><b>菜单里的「退出登录」</b><br/>工作台右上角「☰」抽屉或工作台功能目录中的「退出登录」，同样先弹确认框，确认后才回到登录页。</div>
<div class="card"><b>深链/刷新直达子页</b><br/>直接在子页刷新或从别处链接进入子页（此时没有上级页面），左上角「←」依然可用，<mark class="mark">点一下即回工作台</mark>。</div>

</div>

{book:'op', id:'op-5', title:'店铺装修与主题', html:`
<p class="lead">商城首页由「板块组件」搭成，配合「通道主题」整体换肤。你在后台的装修会<mark class="mark">按板块的排序（sort）依次渲染</mark>成买家看到的第一屏。</p>
<h3>首页组件（板块）</h3>
<div class="card"><b>图标导航组 IconGrid</b><br/>一排图标入口，常用于金刚区（领券、秒杀、签到等）。</div>
<div class="card"><b>分类导航 CategoryNav</b><br/>商品分类的横向导航，把买家快速导向对应类目。</div>
<div class="card"><b>轮播 Banner</b><br/>店铺头图/活动横幅的轮播位，放主视觉与活动入口。</div>
<div class="card"><b>商品楼层 Floor</b><br/>按类目组织的商品陈列区，可设置楼层标题与推荐商品。</div>
<div class="card"><b>展示模板 displayTemplate</b><br/>控制商品详情/列表的版式风格，可按商品选择。</div>
<div class="card"><b>通道主题 themeId</b><br/><span class="mark mark-blue">（旧版，已停用）</span>整站配色的旧开关。现已由「店铺装修 → 主题风格」的五级体系取代，见下一章；存量店铺可在主题风格页一键迁移。</div>
<h3>装修建议流程</h3>
<ol class="steps">
  <li><b>先定风格</b>：在「店铺装修 → 主题风格」选一套模板（或只调主色），让后续配色有基准。</li>
  <li><b>搭首屏</b>：从上往下依次放 Banner → 分类导航 → 图标导航组。</li>
  <li><b>排商品楼层</b>：按主营类目添加 Floor，并为每个商品设定合适的展示模板。</li>
  <li><b>检查排序</b>：确认各板块的 <code>sort</code> 顺序，前端严格按此渲染。</li>
</ol>
<div class="warn"><b>注意排序：</b>板块顺序由 <mark class="mark">sort 字段</mark>决定，新增板块后务必核对，否则可能出现「楼层在 Banner 上面」。</div>
<h3>店铺信息（名称 / 电话 / Logo / 税率 / 库存）</h3>
<p>后台「店铺装修 → 店铺信息」维护店铺基础资料：店铺名、客服电话、简介、<mark class="mark">店铺 Logo</mark>（选图后点保存生效，历史 URL 值兼容显示）、默认分享图，以及税率方式（含税价 / 零税率 / 不含税价）与库存管理方式（简单库存 / Odoo 库存预留）。</p>
<img class="img" src="shots/op05_shop_info.png" alt="店铺信息-名称电话Logo税率库存">
<div class="imgcap">图 W2 · 店铺信息（Logo 从图片库选图，税率/库存方式分段切换）</div>`},
{book:'op', id:'op-5b', title:'主题风格（五级可回退配色体系）', html:`
<p class="lead">整站配色与风格统一走「<mark class="mark">店铺装修 → 主题风格</mark>」这一页：<b>选模板 = 换整套配色与页面版式；令牌覆盖 = 只改本店主色/辅色/圆角</b>。此前放在「店铺信息」页的模板选择已迁移到这里。</p>
<h3>五级回退链（L0 → L4）</h3>
<table>
  <tr><th>层级</th><th>名称</th><th>在哪里配</th><th>说明</th></tr>
  <tr><td>L0</td><td>内建默认</td><td>—</td><td>代码兜底，永不空白</td></tr>
  <tr><td>L1</td><td>全局配置</td><td>平台 → 全局配置</td><td>本端所有店铺的底层兜底</td></tr>
  <tr><td>L2</td><td>风格模板</td><td>平台 → 风格模板库</td><td>选一套模板整体换肤 + 换版式</td></tr>
  <tr><td>L3</td><td>店铺覆盖令牌</td><td><b>店铺 → 主题风格</b></td><td>只覆盖本店主色/辅色/圆角</td></tr>
  <tr><td>L4</td><td>页面 / 模块</td><td>店铺 → 页面装修</td><td>详情页块级样式、分类/购物车/我的页配置</td></tr>
</table>
<p>逐级深合并，缺哪层用下一层，<mark class="mark">永远不会白屏或错色</mark>；模板被停用或跨端时自动回退。</p>
<h3>主题风格页六段怎么做</h3>
<ol class="steps">
  <li><b>选目标端</b>：顶部切「nshop 商城 / youshop 商城」，模板列表按端过滤。</li>
  <li><b>看生效摘要</b>：色块 + 模板名 + 生效主色 + 来源徽标（L1 / L2 / L3），一眼看出当前配色从哪来。</li>
  <li><b>选模板</b>：点模板卡片（或「不引用模板」）。</li>
  <li><b>（可选）令牌覆盖</b>：只填主色 / 辅色 / 圆角，留空的字段自动回退上一级。</li>
  <li><b>旧版主题</b>：若出现黄色「检测到旧版主题」提示条，点「一键迁移为令牌覆盖」。</li>
  <li><b>看合并结果预览</b>：逐项显示真实生效值与来源徽标 → 确认后点「保存主题」。</li>
</ol>
<h3>模板库：不用写 JSON</h3>
<p>「平台 → 风格模板库」点「＋新建模板」：填名称 → 选目标端 → 点配色方案（淘宝橙 / 京东红 / 唯品会蓝紫 / 科技蓝 / 清雅绿 / 极夜黑…）→ 勾选适用页面与商品详情版式（经典 / 楼层 / 双通道）→ 保存。点开模板还有「合并预览」tab，可直接看合并后的真实值。</p>
<img class="img" src="shots/theme-unify-01a-admin-pick-nshop.png" alt="主题风格页-选模板与令牌覆盖">
<div class="imgcap">图 W3 · 主题风格页（选模板 + 令牌覆盖 + 生效主色与来源徽标）</div>
<img class="img" src="shots/theme-unify-06b-tpl-form-palette.png" alt="模板库结构化表单-选配色方案">
<div class="imgcap">图 W4 · 模板库结构化表单（点配色方案即带出主色/辅色/圆角，无需写 JSON）</div>
<div class="warn"><b>找不到模板？</b>租户管理员默认没有模板库读取权限，模板列表会为空。请让平台管理员用 <code>superadmin</code> 配置，或给该角色授予模板库权限。</div>`},
{book:'op', id:'op-6', title:'商品管理', html:`
<p class="lead">商品是你与买家交易的基础。合理分类、维护规格、挑选展示模板，能极大提升成交率。</p>
<div class="card"><b>分类（Collection）</b><br/>先用分类给商品归类，首页的「分类导航」和「商品楼层」都依赖它。建议先画好类目树再上架。</div>
<div class="card"><b>商品（Product）</b><br/>一个商品对应多个规格（SKU）。维护基础信息、详情、图片与<mark class="mark">展示模板 displayTemplate</mark>。</div>
<div class="card"><b>规格（Variant / SKU）</b><br/>颜色、尺码等变化体，各自有价格与库存，买家下单时选择具体规格。</div>
<div class="card"><b>上下架（Enabled）</b><br/>未启用状态前端不可见，建议先维护好内容再启用，避免半成品上架。</div>
<h3>新商品上线 CheckList</h3>
<table>
  <thead><tr><th>序号</th><th>事项</th><th>说明</th></tr></thead>
  <tbody>
    <tr><td>1</td><td>归类</td><td>挂到对应分类下，便于首页楼层与导航引用。</td></tr>
    <tr><td>2</td><td>完整资料</td><td>标题、主图、详情、规格齐全。</td></tr>
    <tr><td>3</td><td>选择展示模板</td><td>按商品形态选 <code>displayTemplate</code>（如 <code>standard</code>）。</td></tr>
    <tr><td>4</td><td>设价格与库存</td><td>为每个 SKU 配价格、可用库存与策略。</td></tr>
    <tr><td>5</td><td>预览后启用</td><td>确认无误再启用上架。</td></tr>
  </tbody>
</table>`},
{book:'op', id:'op-7', title:'价格与库存', html:`
<p class="lead">价格决定毛利，库存决定履约。youshop 的库存是<mark class="mark">「下单即占用、成交/取消即释放」</mark>的动态机制。</p>
<div class="card"><b>价格</b><br/>在 SKU 上维护，支持一口价与促销价位。</div>
<div class="card"><b>库存占用</b><br/>买家进入支付阶段（ArrangingPayment）时系统<mark class="mark">锁定库存</mark>，防止超卖。</div>
<div class="card"><b>订单取消释放</b><br/>订单取消/超时未支付时，占用的库存<mark class="mark">自动释放</mark>回可售库存，不泄漏。</div>
<div class="card"><b>库存核查</b><br/>若发现长期占用不释放，优先核查订单是否停在「支付中」被卡住的状态。</div>
<div class="note"><b>温馨提示：</b>库存释放逻辑已内置，正常情况下无需手工干预；退款、取消等售后动作都会带动库存回补。</div>`},
{book:'op', id:'op-8', title:'商品价格 · 库存 · 图片（含税率开关）', html:`
<p class="lead">商户录入商品时最常关心的三件事：<mark class="mark">价格为什么和录的不一样</mark>、<mark class="mark">库存改了不生效</mark>、<mark class="mark">编辑商品时图片不见了</mark>。本节说明这三类问题的成因与正确用法，并按「修复后」的口径给出操作结果。</p>
<h3>1. 税率开关（价格显示的关键）</h3>
<p>后台「店铺信息 → 启用含税价」控制<mark class="mark">税率是否参与价格计算</mark>（默认开启）：</p>
<ul>
  <li><b>开启（默认）</b>：录入的是<mark class="mark">税前净价</mark>，C 端按 <code>净价 × (1 + 税率)</code> 展示含税价并结算。由于 <code>pricesIncludeTax</code>，重新打开商品时表单显示的是折算后的净价（如录 168、含 13% 税则显示 148.67），这属正常换算，非价格丢失。</li>
  <li><b>关闭</b>：税率不再参与，C 端商品展示价与购物车结算价<mark class="mark">直接用后台录入的净价</mark>，录 168 就全程显示 168。适用于免税 / 海外 / B2B 等场景。</li>
</ul>
<img class="img" src="shots/cjk_tax_switch.png" alt="店铺信息-启用含税价开关">
<div class="imgcap">图 W1 · 店铺信息「启用含税价」开关（默认开启）</div>

<h3>2. 库存更新（多租户口径一致）</h3>
<p>新建/编辑商品改动库存后，系统<mark class="mark">写入当前店铺（租户）的默认库存仓</mark>，不再落入全局默认仓导致「改了没反应」。以「库存 76 改为 88」为例，保存并<mark class="mark">硬刷新</mark>后，编辑页库存字段仍显示新值 88，跨刷新持久化。</p>
<div class="warn"><b>提示：</b>C 端购物车/结算库存占用与释放口径不变；后台修改后立即对买家生效。</div>

<h3>3. 商品图片（编辑时不丢失）</h3>
<p>进入编辑页会自动<mark class="mark">按已选图片 ID 预加载</mark>（含只设主图 <code>featuredAsset</code>、<code>assets</code> 为空的商品），旧图不会因超出「最新 30 条」列表而展示空白；保存时图片随 <code>assetIds</code> 一起持久化，硬刷新后主图依旧保留。</p>
<img class="img" src="shots/cjk_edit_preload_stock.png" alt="编辑商品-图片预加载+库存76">
<div class="imgcap">图 W2 · 编辑商品：主图预加载、库存显示 76</div>
<img class="img" src="shots/cjk_persist_stock88.png" alt="保存并硬刷新-主图保留+库存88">
<div class="imgcap">图 W3 · 改库存 88 并保存、硬刷新后：主图保留 + 库存 88（持久化）</div>`},
{book:'op', id:'op-9', title:'订单与售后', html:`
<p class="lead">订单从生成到完结按固定状态流转，读懂这条链路就能在后台准确跟进每一单。</p>
<h3>订单状态机</h3>
<div class="flow">
  <div class="frow"><span class="fnode">待支付</span><span class="farrow">→</span><span class="fnode">支付中<br/>锁定库存</span><span class="farrow">→</span><span class="fnode">已支付</span><span class="farrow">→</span><span class="fnode">配货中</span><span class="farrow">→</span><span class="fnode">已发货</span><span class="farrow">→</span><span class="fnode">已完成</span></div>
  <div class="frow"><span class="fnode">待支付</span><span class="farrow">→</span><span class="fnode">已取消<br/>释放库存</span></div>
  <div class="frow"><span class="fnode">已支付</span><span class="farrow">→</span><span class="fnode">售后处理</span><span class="farrow">→</span><span class="fnode">售后完成</span></div>
</div>
<div class="card"><b>履约</b><br/>订单支付后依次经历配货、发货直至完成，及时更新物流信息有助体验。</div>
<div class="card"><b>售后</b><br/>退款、退货、换货等申请在后台处理，库存回补在售后完成时体现。</div>
<div class="card"><b>超时取消</b><br/>长时间未支付订单会被取消，<mark class="mark">占用库存同步释放</mark>。</div>
<div class="card"><b>查询</b><br/>按订单号、买家、状态检索，或导出数据复盘。</div>
<img class="img" src="shots/op09_order_list.png" alt="订单列表-状态筛选与卡片">
<div class="imgcap">图 O2 · 订单列表（状态统计 / 筛选 Tab / 卡片操作区：发货、详情）</div>
<h3>订单详情：备注与改价</h3>
<p>进入订单详情可查看状态、金额明细、商品明细、支付与物流信息。<mark class="mark">「备注」恒显示</mark>，可记录内部备注（不发给买家）；订单处于<mark class="mark">待支付 / 支付中（可修改状态）</mark>时，操作区出现「改价」，输入目标金额后按差额生成后台改价 surcharge，改价成功即刷新页面。</p>
<img class="img" src="shots/op09_order_detail.png" alt="订单详情-待发货单与备注按钮">
<div class="imgcap">图 O3 · 订单详情（备注按钮；待发货单操作：去发货 / 取消订单 / 去核销）</div>
<img class="img" src="shots/op09_order_detail_adjust.png" alt="订单详情-加购中单显示备注与改价">
<div class="imgcap">图 O4 · 加购中订单：备注 + 改价按钮（仅可修改状态显示改价）</div>`},
{book:'op', id:'op-10', title:'常见问题（FAQ）· 运营', html:`
<details><summary>买家打开域名却看不到我的品牌主题，像「默认店铺」</summary><p>大概率是<mark class="mark">Channel 域名映射未配置</mark>，系统没能通过 <code>resolveChannelByDomain</code> 认领到你的租户，回退到默认主题。请确认后台 Channel 的域名字段与访问域名完全一致。</p></details>
<details><summary>首页板块顺序不对，楼层跑到 Banner 上面了</summary><p>板块按 <mark class="mark"><code>sort</code> 排序渲染</mark>。请重新核对各板块排序值，让 Banner/导航在前、商品楼层在后。</p></details>
<details><summary>为什么有的商品详情页版式不一样</summary><p>每个商品可选独立<mark class="mark">展示模板 <code>displayTemplate</code></mark>。版式不同通常是选了不同模板；找回后台把模板设为一致即可。</p></details>
<details><summary>上传的视频/PDF 买家访问提示 403</summary><p>这是<mark class="mark">媒体鉴权正常生效</mark>，此类媒体不支持匿名直访，需登录或通过签名播放接口（<code>stream-token</code>）播放，防止资源被爬取。</p></details>
<details><summary>改完装修/商品，买家看到的还是旧样</summary><p>部分环境（尤其微信浏览器）会缓存 <code>index.html</code>。系统已对首页设置 <code>no-cache</code>，正常情况下刷新即可。</p></details>
<details><summary>订单取消了，为什么库存看起来还占着</summary><p>请核查订单是否还停在「支付中」等中间态。确认订单确实取消/退款后库存会自动回补；若长期异常可联系平台核查该单。</p></details>`},
{book:'op', id:'op-11', title:'到店自提核销与收款', html:`
<p class="lead">到店自提是<mark class="mark">线上支付 / 到店收款</mark>两种资金形态并存的一种履约方式。本手册带你掌握「扫码核销」、「收款确认」与「防漏收」的运营要点。</p>
<h3>两种收款形态</h3>
<table>
  <thead><tr><th>形态</th><th>识别</th><th>收款时机</th></tr></thead>
  <tbody>
    <tr><td>线上支付</td><td>余额 / 在线支付等</td><td>下单即已收款</td></tr>
    <tr><td class="mark">到店收款</td><td>货到付款 / 固定聚合码收款</td><td><strong>提货当刻由店员确认收款</strong></td></tr>
  </tbody>
</table>
<div class="warn"><b>防漏收设计：</b>到店收款单在店员<mark class="mark">确认收款前不可核销</mark>，系统以核销动作作为「已收款」的事实来源，为发货环节是否收费提供依据，防止忘记收款。</div>
<h3>核销入口</h3>
<p>管理后台进入「到店自提核销」页，可<mark class="mark">扫码（扫一扫）或手动输入 6 位核销码</mark>完成核销。列表展示每张自提单的核销码与收款状态（待到店收款 / 已收款）。</p>
<img class="img" src="shots/o01_redeem_scan.png" alt="核销页-扫码入口与待核销列表">
<div class="imgcap">图 O1 · 核销页（扫码入口 + 待核销自提单收款状态）</div>
<img class="img" src="shots/g2_p0_redeem_price.png" alt="核销页-待核销清单商品行金额">
<div class="imgcap">图 O1a · 待核销自提单清单（商品行显示应付金额 ¥20.00，已修复为真实金额、不再为 0）</div>
<h3>确认收款的建议流程</h3>
<ol class="steps">
  <li><b>核对核销码</b>：扫码或输入买家出示的 6 位码。</li>
  <li><b>查验收款</b>：若是「待到店收款」单，<mark class="mark">先确认实际已收款</mark>。</li>
  <li><b>确认核销</b>：核销即视为已收款，系统自动标记，订单方可进入发货/履约环节。</li>
</ol>
<div class="tip"><b>为什么扫码即可：</b>店员到店核销即确认已收款（到店收银单必须 <code>collect=true</code> 后端才放行），从机制上杜绝「没收款就交付」。</div>`},
{book:'op', id:'op-12', title:'收款台账（核销人即收款人）', html:`
<p class="lead">每笔成功的到店核销收款都会登记进「收款台账」。台账按<mark class="mark">当前门店渠道</mark>隔离——既看本店作为<mark class="mark">商品归属方</mark>的分账，也看本店<mark class="mark">经手核销收款</mark>记录，因此<mark class="mark">核销人即收款人</mark>，两语等同。</p>
<h3>台账顶部汇总</h3>
<table>
  <thead><tr><th>卡片</th><th>口径</th></tr></thead>
  <tbody>
    <tr><td>今日收款</td><td>本店今日核销收款的合计金额与笔数（橙色高亮）</td></tr>
    <tr><td>已收</td><td>累计已收款金额与笔数（PAID 状态）</td></tr>
    <tr><td>待收款</td><td>仍处待到店核销确认中的金额与笔数（PENDING_SIGN）</td></tr>
  </tbody>
</table>
<h3>今日收款明细</h3>
<p>顶部汇总下方单列「今日收款明细」，逐笔展示：<mark class="mark">单号、收款金额、收款人（核销人）、收款方式、归属商户、入账时间</mark>。同一笔也会出现在下方「收款台账」列表中。核销码完成后，台账应按核销码查询到对应金额的已收款记录（收款人即核销的店员）。</p>
<div class="warn"><b>收款归属修正：</b>早期版本存在「门店核销收款后，台账因按商品归属渠道过滤而看不到」的问题。现已将台账同时记录<mark class="mark">核销渠道（collectorChannelId）</mark>与<mark class="mark">收款人（collectorName）</mark>，按 <code>tenantChannelId OR collectorChannelId</code> 过滤，确保本店可见自己经手的每笔收款。</div>
<img class="img" src="shots/xledger_t2_g723zm.png" alt="收款台账-今日汇总与 g723zm 明细">
<div class="imgcap">图 O2 · 收款台账（今日收款 ¥200 1 笔 / 已收 ¥3145.07 25 笔；明细含 g723zm ¥200 收款人=陈店长）</div>
<h3>状态筛选与 CSV 导出</h3>
<p>工具栏提供「全部 / 已收 / 待收」三段筛选与「导出 CSV」按钮。导出<mark class="mark">按当前筛选结果</mark>生成 CSV（含 UTF-8 BOM，Excel 打开中文不乱码），列依次为：时间、订单号、收款人、收款渠道、收款方式、金额、状态，文件名形如 <code>收款台账_20260920_1015.csv</code>。</p>
<img class="img" src="shots/op12_ledger.png" alt="收款台账-筛选与导出CSV">
<div class="imgcap">图 O2a · 收款台账（已收 5 笔，工具栏：全部/已收/待收 + 导出 CSV）</div>
<img class="img" src="shots/op12_ledger_pending.png" alt="收款台账-待收筛选">
<div class="imgcap">图 O2b · 切「待收」筛选后的台账（0 笔空态）</div>
<h3>日期筛选与按日小计</h3>
<p>状态筛选旁提供<mark class="mark">日期段筛选</mark>：今日 / 近 7 天 / 近 30 天 / 全部。切到非「全部」时，列表顶部显示<mark class="mark">「当日小计」</mark>（所选日期段的收款笔数与合计金额），明细卡逐笔展示<mark class="mark">单号 / 金额 / 收款方式 / 状态</mark>，便于核对每日实收。</p>
<img class="img" src="shots/ops5_ledger.png" alt="收款台账-日期段筛选与当日小计">
<div class="imgcap">图 O2c · 收款台账（日期段 今日/近7天/近30天/全部 + 当日小计 9 笔 ¥3172.00 + 明细卡）</div>
<h3>导出按日汇总</h3>
<p>「导出 CSV」在原有明细导出基础上增加<mark class="mark">按日汇总导出</mark>：按日期聚合收款笔数与金额，一行一天，适合日报 / 对账；明细与汇总两段均含 UTF-8 BOM，Excel 打开不乱码。</p>`},
{book:'op', id:'op-13', title:'商户订单可见性（本店商品单）', html:`
<p class="lead">当一个商户的商品在<mark class="mark">默认商城</mark>被顾客购买时，该订单归属默认商城渠道，商户后台的「本店渠道单」里会看不到它。为此系统提供「<mark class="mark">本店商品单</mark>」维度，按<mark class="mark">商品归属（shopId）跨渠道归集</mark>，让商户一屏看全自己卖出的所有订单。</p>
<h3>双维度切换</h3>
<table>
  <thead><tr><th>维度</th><th>口径</th><th>适用</th></tr></thead>
  <tbody>
    <tr><td>本店渠道单</td><td>当前店铺（Channel）内直接产生的订单</td><td>自营店内成交</td></tr>
    <tr><td class="mark">本店商品单</td><td>含当前店铺商品、在任何渠道成交的订单（按商品 shopId 归集）</td><td>在默认商城售出的本店商品</td></tr>
  </tbody>
</table>
<div class="note"><b>为什么需要它：</b>商户在默认商城上架的商品，订单归属默认商城渠道。仅看「本店渠道单」会<mark class="mark">漏掉这部分销售</mark>；切到「本店商品单」即可完整核对本店商品的所有成交。</div>
<img class="img" src="shots/o02_order_shop_scope.png" alt="订单列表-本店商品单维度">
<div class="imgcap">图 O2 · 订单列表「本店商品单」维度（跨渠道归集本店商品订单）</div>
<h3>操作要点</h3>
<ol class="steps">
  <li><b>切到「本店商品单」</b>：回到后台「订单列表」，顶部在「本店渠道单 / 本店商品单」间切换。</li>
  <li><b>结合状态筛选</b>：配合待付款 / 待发货 / 已发货等状态 Tab，快速定位该处理的单。</li>
  <li><b>保证金流对照</b>：对本店商品单同样遵守上述到店自提核销收款规则，避免漏收。</li>
</ol>
<div class="tip"><b>口径说明：</b>「本店商品单」忽略渠道状态筛选，展示的是<mark class="mark">所有含本店商品的成交</mark>，含默认商城等外部渠道；金额为含税总价，与渠道单互补但不重复计数。</div>`},
{book:'op', id:'op-14', title:'优惠券（多租户发行与使用）', html:`
<p class="lead">优惠券由<mark class="mark">每个租户（店铺）独立发行</mark>，买家可在本店或默认商城领取使用。系统支持满减、折扣、无门槛直减与<mark class="mark">免邮券</mark>四种类型，券名与说明支持多语言。</p>
<h3>优惠券类型</h3>
<table>
  <thead><tr><th>类型</th><th>含义</th><th>示例</th></tr></thead>
  <tbody>
    <tr><td>FIXED</td><td>满额立减（需满足门槛）</td><td>满 100 减 20</td></tr>
    <tr><td>PERCENT</td><td>按折扣比例优惠</td><td>8.5 折</td></tr>
    <tr><td>FULL</td><td>无门槛直减</td><td>立减 10 元</td></tr>
    <tr><td class="mark">FREE_SHIPPING</td><td>免配送费</td><td>全场免邮券</td></tr>
  </tbody>
</table>
<h3>发行与使用范围</h3>
<div class="card"><b>每租户发行</b><br/>优惠券归属发行店铺（shopId），管理员只能管理<mark class="mark">本店发行的券</mark>，无法查看/编辑其他店铺的券。</div>
<div class="card"><b>使用范围</b><br/>券可用于<mark class="mark">本店商品</mark>或<mark class="mark">默认租户（默认商城）</mark>。在默认商城使用时，仅当订单包含<mark class="mark">本店商品行</mark>才可核销，且折扣只作用于本店商品行。</div>
<div class="card"><b>多语言</b><br/>券名与说明支持 zh-CN / en-US 等多语言，按买家当前语言自动显示对应文案。</div>
<h3>买家端：领券中心与我的券包</h3>
<p>商城「优惠券」页提供<mark class="mark">领券中心</mark>（浏览并领取可领券）与<mark class="mark">我的券包</mark>（按未使用/已使用/已过期查看已领券）两个 Tab。</p>
<img class="img" src="shots/o03_coupon_centre.png" alt="领券中心-全场免邮券与满减券">
<div class="imgcap">图 O3 · 领券中心（免邮券 + 满减券，券名按语言显示）</div>
<img class="img" src="shots/o04_coupon_wallet.png" alt="我的券包-状态筛选">
<div class="imgcap">图 O4 · 我的券包（未使用 / 已使用 / 已过期筛选）</div>
<h3>管理端：发券与券管理</h3>
<p>后台「优惠券管理」入口可<mark class="mark">创建 / 编辑 / 启停 / 删除</mark>本店优惠券，配置类型、面额、门槛、有效期、限量与多语言名称。</p>
<img class="img" src="shots/o05_coupon_admin_list.png" alt="优惠券管理-列表">
<div class="imgcap">图 O5 · 优惠券管理列表</div>
<img class="img" src="shots/o06_coupon_admin_edit.png" alt="优惠券编辑-类型与多语言配置">
<div class="imgcap">图 O6 · 优惠券编辑（类型 + 多语言名称）</div>
<img class="img" src="shots/op14_coupons.png" alt="优惠券管理-列表与操作">
<div class="imgcap">图 O6a · 优惠券列表（发行量 / 有效期 / 归属店铺，操作：停用 / 编辑 / 明细 / 删除）</div>
<img class="img" src="shots/g2_f2_coupon_toggle_confirm.png" alt="优惠券-启停二次确认弹窗">
<div class="imgcap">图 O6b · 优惠券启用 / 停用二次确认弹窗（防止误操作；点「取消」不改状态）</div>
<h3>券使用明细（领取 / 核销双页签）</h3>
<p>点列表任意券的「明细」弹出<mark class="mark">券使用明细</mark>弹层，默认「领取明细」页签逐笔展示领取人（姓名 + 手机号）、券码、状态（未使用 / 已核销 / 已退回 / 已过期 / 已失效）、来源（领取 / 定向发放 / 兑换）与领取时间；切「核销明细」页签仅展示已核销记录及核销订单号 / 时间。列表分页懒加载，滚动到底自动加载更多。</p>
<img class="img" src="shots/op14_coupon_detail.png" alt="券使用明细-领取页签">
<div class="imgcap">图 O6c · 券使用明细（领取明细页签：客户 / 券码 / 状态 / 来源 / 时间）</div>
<h3>定向发券与站内消息通知</h3>
<p>管理端「营销 → 定向发券」可按关键词<mark class="mark">搜索本渠道客户</mark>（姓名/手机号/邮箱）并勾选，或一键「全部本渠道」圈选批量发券；发券时可选择<mark class="mark">发送站内消息</mark>，买家在 C 端「消息中心」收到「优惠券到账」通知，券码直达「我的券包」。</p>
<img class="img" src="shots/o12_webadmin_coupon_issue.png" alt="定向发券页-选券选客户与通知开关">
<div class="imgcap">图 O12 · 定向发券（①选券 → ②搜索勾选客户 → ③发券通知 → ④确认发券）</div>
<img class="img" src="shots/o13_nshop_messages.png" alt="nshop 消息中心-优惠券到账通知">
<div class="imgcap">图 O13 · C 端消息中心（定向发券站内通知，含券码，未读红点）</div>
<img class="img" src="shots/o14_nshop_coupon_wallet.png" alt="nshop 我的券包-定向发放的满减券">
<div class="imgcap">图 O14 · 我的券包（定向发放的「满100减20」券，来源 ADMIN）</div>
<div class="warn"><b>使用提示：</b>若在默认商城选券时报「优惠券不适用当前订单」，请确认订单包含<mark class="mark">本店商品行</mark>且满足券的门槛；跨店券不可用于不含本店商品的订单。</div>
<h3>运营看板（三读 + KPI + 快捷发行）</h3>
<p>优惠券列表页顶部提供<mark class="mark">运营三读</mark>与 KPI：<mark class="mark">发放总数 / 已核销 / 当前可用</mark>（已发放 − 已核销），一眼掌握券的整体消耗与剩余库存。每张券卡片展示<mark class="mark">「已发放 N | 已使用 N | 剩余 N」</mark>三读明细；对未下架的券提供<mark class="mark">「去发行」</mark>快捷入口，直接进入发行流程，无需先点进详情。</p>
<img class="img" src="shots/ops5_coupon.png" alt="优惠券-运营三读KPI与去发行">
<div class="imgcap">图 O6d · 优惠券运营看板（KPI 发放总数 36 / 可用券 193；券卡「已发放3 | 已使用— | 剩余97」+ 去发行按钮）</div>`},
{book:'op', id:'op-16', title:'成员密码管理与角色授权', html:`
<p class="lead">「本租户人员」页提供<mark class="mark">成员密码管理</mark>与<mark class="mark">角色授权</mark>：租户管理员可为低权限成员重置密码、本人可自助修改密码；授予角色时<mark class="mark">只能授予权限小于自己的角色</mark>。</p>
<h3>人员列表与密码管理入口</h3>
<p>进入「人员管理 → 本租户人员」，顶部有<mark class="mark">「修改密码」</mark>与<mark class="mark">「＋添加人员」</mark>两个入口。成员行展示姓名、ID、角色与启停开关：低权限成员行显示<mark class="mark">「重置密码」</mark>链接，<mark class="mark">自己的行不显示</mark>（防止误重置本人口令）。</p>
<img class="img" src="shots/r01_tenant_members.png" alt="本租户人员列表-修改密码入口与重置密码">
<div class="imgcap">图 R1 · 本租户人员（低权限成员有「重置密码」，本人无）</div>
<h3>添加人员与角色选择</h3>
<p>点「＋添加人员」填写邮箱（全局唯一）、姓名、手机号并选择角色；角色下拉<mark class="mark">按 id 去重</mark>，且仅列出<mark class="mark">可授予</mark>的角色——<code>grantable=false</code> 的「租户管理员」等不可授项被过滤，无重复项。</p>
<img class="img" src="shots/r02_add_member_roles.png" alt="添加人员弹层-角色下拉">
<div class="imgcap">图 R2 · 添加人员（角色下拉无重复、无不可授项）</div>
<h3>分配角色</h3>
<p>点成员行的「角色」打开分配角色弹层，勾选后保存即生效。可授范围与添加人员一致：<mark class="mark">只能授予权限小于自己的角色</mark>，避免越权。</p>
<img class="img" src="shots/r03_assign_roles.png" alt="分配角色弹层">
<div class="imgcap">图 R3 · 分配角色（销售 / 库存）</div>
<h3>修改密码</h3>
<p>点顶部「修改密码」进入改密页，需填写<mark class="mark">原密码</mark>验证身份，再输入新密码（≥8 位，含大小写/数字）并再次确认；提交后下次登录使用新密码。</p>
<img class="img" src="shots/r04_change_password.png" alt="修改密码页-原密码与新密码">
<div class="imgcap">图 R4 · 修改密码（原密码 + 新密码 + 确认）</div>
<h3>重置密码</h3>
<p>对低权限成员点「重置密码」，确认后其口令重置为<mark class="mark">默认口令 you123123</mark>；被重置成员下次登录建议尽快修改。</p>
<div class="warn"><b>安全边界：</b>重置仅对<mark class="mark">低权限成员</mark>开放；<mark class="mark">租户管理员角色不可被授予、本人口令不可被他人重置</mark>，本人改密必须提供原密码。</div>
<h3>查看成员信息</h3>
<p>点击成员列表中的「显示姓名」，可查看该成员的完整信息，包括登录用户名（邮箱）、手机号、角色、状态、人员 ID 与加入时间。</p>
<img class="img" src="shots/r05_member_info.png" alt="成员信息弹窗">`},
{book:'op', id:'op-17', title:'房型模板库与酒店版式', html:`
<p class="lead">酒店房型商品采用「<mark class="mark">房型模板库 → 商品变体酒店配置 → 店铺酒店版式</mark>」三级配置：先在「平台 → 房型模板库」沉淀可复用的房型模板，再到商品编辑页为变体套用模板生成配置快照，最后在店铺信息中把详情页版式切到「酒店」，前台即渲染酒店版式详情页（日期条 + 房型卡 + 逐日计价 + 预订规则）。</p>
<h3>房型模板库</h3>
<p>入口：<mark class="mark">平台 → 房型模板库</mark>。列表展示每张模板的名称、标识 code、基准价（元/晚）、可住晚数区间与排序号；右上角「＋新建模板」打开表单，点模板行进入编辑，行内开关可启停模板，右侧「删除」可移除（已应用该模板的商品不受影响）。</p>
<img class="img" src="shots/r06_hotel_room_templates.png" alt="房型模板库列表-豪华套房">
<div class="imgcap">图 R6 · 房型模板库（样例模板「豪华套房」）</div>
<h3>新建模板</h3>
<p>表单必填：<code>名称</code>（如「豪华套房」）、<code>标识 code</code>（如 <code>suite</code>）、<code>基准价（元/晚）</code>；其余为启用开关、排序号与多段 JSON：</p>
<ul>
<li><b>规格 specs JSON</b>：床型/面积/人数/早餐，如 <code>{"bedType":"大床","area":40,"capacity":2,"maxCapacity":2,"breakfast":"included","breakfastCount":2}</code>。</li>
<li><b>默认房间 defaultRooms JSON</b>：房间号/楼层/景观，如 <code>[{"no":"801","floor":8,"view":"湖景"}]</code>，套用后成为商品房型明细。</li>
<li><b>日历价格段 JSON</b>：周内/周末倍率，如 <code>[{"type":"weekday","rate":1.0},{"type":"weekend","rate":1.2}]</code>。</li>
<li><b>连住优惠 JSON</b>：满晚数折扣，如 <code>[{"minNights":3,"rate":0.9}]</code>。</li>
<li><b>预订规则 JSON</b>：最少/最多晚数、提前预订天数、入住/离店时间、取消政策与押金方式，如 <code>{"minNights":1,"maxNights":30,"advanceDays":30,"checkInTime":"14:00","checkOutTime":"12:00","cancelPolicy":{"type":"freeUntil","freeUntilHours":24},"depositType":"payAtHotel"}</code>。</li>
</ul>
<img class="img" src="shots/r07_hotel_template_form.png" alt="新建模板弹层表单">
<div class="imgcap">图 R7 · 新建模板（名称/code/基准价/日历价格段/连住优惠/预订规则 JSON）</div>
<div class="warn"><b>JSON 校验：</b>四段 JSON 任一格式非法都会拦截保存并提示对应字段；价格段 <code>type</code> 仅支持 <code>weekday</code>/<code>weekend</code>，取消政策与押金方式需符合后端枚举。</div>
<h3>套用模板到商品变体</h3>
<p>进入商品编辑页的「规格矩阵」标签页，滚动到<mark class="mark">「酒店房型配置」</mark>分组（仅编辑态、有变体 id 时显示）：未配置时先点「点击选择模板」从房型模板库挑选，再点「套用模板生成快照」一次性回填规格/默认房间/日历价格段/预订规则；套用后显示已应用模板标识，并可在 <code>房间明细 JSON</code>、<code>日历价格段 JSON</code> 中微调，点「保存酒店配置」落库。</p>
<img class="img" src="shots/r08_hotel_product_config.png" alt="商品编辑页-酒店房型配置分组">
<div class="imgcap">图 R8 · 商品编辑「酒店房型配置」（已套用模板快照态）</div>
<h3>店铺详情页版式</h3>
<p>入口：<mark class="mark">店铺装修 → 店铺信息</mark>，「详情页版式」选择<mark class="mark">「酒店」</mark>并保存。此后该店商品详情页按酒店版式渲染；<mark class="mark">若商品变体未配置 hotelRoomConfig 则自动回退经典版式</mark>，普通商品不受影响。</p>
<h3>前台酒店版式详情页</h3>
<p>手机端打开已配置的酒店商品，自上而下依次为：<mark class="mark">入住/离店日期条</mark>（自动计算晚数与每晚价）、<mark class="mark">房型卡</mark>（床型/面积/人数/含早）、<mark class="mark">房间明细</mark>（可展开查看每间房号/楼层/景观并选择）、<mark class="mark">逐日计价</mark>（按所选日期逐日列价、预估总价与日均价）、<mark class="mark">预订规则</mark>（入住/离店时间、取消政策、押金与加床费）。</p>
<img class="img" src="shots/r09_hotel_detail.png" alt="nshop 手机端酒店详情页">
<div class="imgcap">图 R9 · 酒店版式详情页（日期条 + 房型卡 + 房间明细展开 + 逐日计价 + 预订规则）</div>
<h3>默认房型模板（18 种）</h3>
<p>系统启动时自动<mark class="mark">幂等补种 18 种默认房型模板</mark>：按 <code>code</code> 判定，<mark class="mark">已存在或曾删除的 code 不会重复插入</mark>；若客户删除了默认房型，重启后<mark class="mark">不会自动补回</mark>，需要时手动新建即可。每张默认模板预置 6 间默认房间与完整预订规则（价格段/连住优惠/含早押金），可直接套用或微调：</p>
<ul>
<li><code>standard-twin</code> 标准双床房（双床 1.2m×2，¥288/晚）</li>
<li><code>standard-king</code> 标准大床房（¥288/晚）</li>
<li><code>superior-king</code> 高级大床房（¥358/晚，城景）</li>
<li><code>superior-twin</code> 高级双床房（双床 1.35m×2，¥358/晚）</li>
<li><code>deluxe-king</code> 豪华大床房（大床 2.0m，¥458/晚，湖景/高层）</li>
<li><code>deluxe-twin</code> 豪华双床房（双床 1.5m×2，可住 3 人，¥458/晚）</li>
<li><code>business-king</code> 商务大床房（含 1 份早，¥428/晚）</li>
<li><code>business-twin</code> 商务双床房（双床 1.35m×2，含 1 份早，¥428/晚）</li>
<li><code>triple</code> 三人间（单人床 1.2m×3，¥398/晚）</li>
<li><code>family-child</code> 家庭亲子房（大床+1.2m 小床，¥518/晚，亲子设施）</li>
<li><code>executive-king</code> 行政大床房（¥688/晚，行政酒廊）</li>
<li><code>executive-suite</code> 行政套房（¥888/晚，独立会客区）</li>
<li><code>deluxe-suite</code> 豪华套房（¥1188/晚，48h 免费取消、预付）</li>
<li><code>presidential-suite</code> 总统套房（¥3888/晚，管家服务、节假日 2.0 倍价）</li>
<li><code>theme-game</code> 电竞主题房（电竞双床，¥498/晚，不含早、不可退）</li>
<li><code>theme-movie</code> 影音主题房（¥468/晚，不含早、不可退）</li>
<li><code>theme-romantic</code> 情侣蜜月房（¥588/晚，蜜月布置）</li>
<li><code>apartment-family</code> 公寓家庭套房（¥728/晚，含厨房，最少连住 2 晚）</li>
</ul>
<div class="warn"><b>标识：</b>code 是模板唯一标识；套用到商品后快照固化，<mark class="mark">此后修改模板不影响已套用商品</mark>。</div>
<h3>列表检索</h3>
<p>模板库列表自带检索栏，方便在 18+ 张模板中快速定位：<mark class="mark">关键词搜索</mark>（按名称 / code / 床型描述 / 标签 / 设施模糊匹配）、<mark class="mark">分类 chips</mark>（全部 / 标准 / 行政套房 / 豪华 / 家庭 / 主题房 / 其他）、<mark class="mark">床型 chips</mark>（全部床型 / 大床 / 双床 / 三床 / 多床）、<mark class="mark">仅看启用</mark>开关与<mark class="mark">基准价 ↑ / ↓</mark>排序。列表底部实时显示<mark class="mark">「共 N 个模板」</mark>，无匹配时出现「清除筛选」一键复位。</p>
<img class="img" src="shots/r11_room_templates_list.png" alt="房型模板库列表-检索栏与18种默认模板">
<div class="imgcap">图 R10 · 房型模板库列表（检索栏 + 18 种默认模板 + 计数）</div>
<h3>JSON 录入引导（三合一）</h3>
<p>新建/编辑弹层底部提供<mark class="mark">录入引导条</mark>，点选即可把合法片段写入对应 JSON 字段，避免手写格式错误：</p>
<ul>
<li><b>常用价格段</b>：平日 1.0 / 周末 1.2 / 国庆 1.8 / 春节 2.0 / 寒暑假 1.5，点选并入<code>日历价格段 JSON</code>（同 type 去重更新）。</li>
<li><b>连住优惠 / 取消政策</b>：连住 3 晚 9 折、5 晚 8 折写入<code>连住优惠 JSON</code>；24h / 48h 免费取消、全程不可退覆盖<code>预订规则 JSON</code> 的 cancelPolicy。</li>
<li><b>快捷输入房间</b>：填房间号（必填）+ 楼层 + 特色景观后点「＋添加」，追加进<code>默认房间 JSON</code>（同房间号覆盖），并显示已加间数。</li>
<li><b>床型</b>：大床 / 双床 / 单人床 / 三床 / 亲子床，写入<code>规格 specs JSON</code> 的 bedType。</li>
<li><b>含早 / 押金</b>：含 2 份 / 含 1 份 / 不含早写入 specs 的 breakfast 与 breakfastCount；到店付 / 预付 / 无需担保覆盖 ruleJson 的 depositType。</li>
</ul>
<img class="img" src="shots/r12_room_template_create_guide.png" alt="新建模板-JSON录入引导条">
<div class="imgcap">图 R11 · 新建模板 JSON 录入引导（点选价格段/床型/取消政策/押金/快捷房间即填充 JSON）</div>
<div class="warn"><b>引导只增不删：</b>引导条负责生成<mark class="mark">合法 JSON 片段</mark>并合并/覆盖对应键，不清空已手写内容；保存时仍做整体 JSON 校验，非法格式仍会拦截。</div>`},
{book:'op', id:'op-18', title:'四流对账：批次 / 差异 / 重跑闭环', html:`
<p class="lead">「平台 → 四流对账」为开启<mark class="mark">物理库存</mark>的租户提供<mark class="mark">业务 / 资金 / 库存 / 配送</mark>四流日对账：按「租户 × 日期」生成对账批次，逐单比对并用 <code>D1-D4</code> 差异类型标记异常订单，支持<mark class="mark">手动立即对账</mark>与<mark class="mark">每日 2:00 后自动日批</mark>（幂等，同日不重复跑），对差异行可<mark class="mark">重跑</mark>复核、闭环确认。</p>
<h3>四流与差异类型</h3>
<p>系统以订单为核对主体，比对四类数据源：<mark class="mark">业务流</mark>（订单应付款与状态）、<mark class="mark">资金流</mark>（分账台账已收金额）、<mark class="mark">库存流</mark>（库存流水扣仓记录）、<mark class="mark">配送流</mark>（配送记录）。发现不一致时按类型标记：</p>
<div class="card"><b>D1 缺配送</b>：已发货/已交付订单缺少有效的配送记录（self / express / pickup 且非草稿态）。<br/><b>D2 扣仓</b>：库存流扣减仓与配送记录出库仓不一致。<br/><b>D3 金额</b>：订单应付 ≠ 线上已收（退款单自动跳过）。<br/><b>D4 镜像</b>：虚拟仓库存与绑定物理仓库存之和不一致。</div>
<h3>批次列表与手动对账</h3>
<p>入口：<mark class="mark">平台 → 四流对账</mark>。顶部提供<mark class="mark">日期选择 + 「立即对账」</mark>按钮：选日期后点击即对该租户执行当日对账，<mark class="mark">同日已有完成批次则幂等跳过</mark>并提示。顶部 KPI 汇总<mark class="mark">全闭环率 / 批次 / 核对订单</mark>；批次卡片展示日期、状态（运行中 / 已完成）与 <mark class="mark">D1-D4 四类差异计数</mark>，存在差异的类别红色高亮。</p>
<img class="img" src="shots/r13_reconcile.png" alt="四流对账页-批次列表与差异计数">
<div class="imgcap">图 R13 · 四流对账批次列表（全闭环率 / D1-D4 差异计数，红色高亮异常）</div>
<h3>批次明细与重跑闭环</h3>
<p>点批次卡片打开明细弹层：逐单列出<mark class="mark">订单号 + 差异标签</mark>（如「D1 缺配送」「D3 金额」，一单可多类并存）；点右侧<mark class="mark">「重跑」</mark>按当前四流数据重新判定该单：仍有差异则保持待处理，已闭环自动标记「已闭环」。差异行的处理建议回到对应业务入口修正（补配送记录 / 修正扣仓 / 补齐回款 / 修正库存镜像）后再重跑确认。</p>
<img class="img" src="shots/r14_reconcile_lines.png" alt="批次明细弹层-差异标签与重跑操作">
<div class="imgcap">图 R14 · 批次明细（D1 缺配送 / D3 金额 标签 + 重跑操作）</div>
<div class="note"><b>自动日批：</b>开启物理库存的租户，系统每日 2:00 后自动执行当日批次（约每 5 分钟检查一次，同日仅跑一次）；未开启物理库存的租户不参与。手动对账不受开关限制，随时可跑。</div>`},
{book:'op', id:'op-19', title:'详情页库存展示（虚拟库存 + 附近库存）', html:`
<p class="lead">商品详情页的库存展示分两层：<mark class="mark">所有租户一律默认只显示虚拟库存数量</mark>（可售总数）；<mark class="mark">仅开启物理库存的租户</mark>，其「物理驱动」商品额外显示<mark class="mark">附近库存</mark>折叠明细（各物理仓 + 库存 + 距离）。</p>
<h3>库存模型速览</h3>
<p>系统为每个租户维护两类仓库：<mark class="mark">虚拟仓</mark>（网络销售可售源，前台「库存 N 件」即虚拟仓 onHand）与<mark class="mark">物理仓</mark>（真实库存）。商品变体绑定物理仓后成为「物理驱动变体」：其虚拟库存由系统<mark class="mark">自动镜像为 Σ 绑定物理仓库存</mark>，销售扣减也落到物理仓，保证线上线下同源不超卖。</p>
<div class="card"><b>三类展示形态</b><br/>① 未开物理库存的租户：仅「库存 N 件」数量行；② 开启物理库存 + 物理驱动变体：数量行 + 「附近库存」折叠明细；③ 开启物理库存 + 纯虚拟变体：仅数量行（无绑定仓，不显示附近库存）。</div>
<h3>后台配置（开启物理库存）</h3>
<p>物理库存开关在<mark class="mark">租户（店铺）配置</mark>中开启（<code>physicalStockEnabled</code>，默认关闭）。开启后创建物理仓（仓库性质 = 物理仓），把商品变体<mark class="mark">绑定到物理仓</mark>（一个变体可绑多仓，可标记默认仓），再为物理仓设置库存。平台侧以管理接口完成（参考脚本 <code>scripts/_seed_d4_stock.mjs</code>）：</p>
<ul>
<li><b>开启开关</b>：<code>updateChannel</code> 写入 <code>customFields.physicalStockEnabled=true</code>。</li>
<li><b>建物理仓</b>：<code>createStockLocation</code>，仓库性质 <code>kind="physical"</code>、编码 <code>code</code>（租户内唯一）。</li>
<li><b>绑定变体</b>：<code>setVariantBindings(variantId, [{ locationId, isDefault }])</code> —— 有绑定即物理驱动。</li>
<li><b>设库存</b>：<code>setVariantStock</code> 写入物理仓 onHand；虚拟仓镜像在销售事务内自动同步为 Σ 物理仓，无需手工双写。</li>
</ul>
<h3>前台展示（手机端）</h3>
<p>物理驱动变体（以「国信南山温泉工作日门票」为例）：详情页显示<mark class="mark">「库存 50 件」</mark>，其下出现<mark class="mark">附近库存</mark>折叠条——汇总可售件数与门店数，并在绑定物理仓配置坐标时显示<mark class="mark">距您最近距离</mark>（未配置坐标则显示「距离未知」）。</p>
<img class="img" src="shots/s01_stock_physical_line.png" alt="物理驱动变体-库存数量行与附近库存折叠">
<div class="imgcap">图 S1 · 物理驱动变体：库存数量行 + 附近库存折叠入口</div>
<img class="img" src="shots/s02_stock_nearby_collapsed.png" alt="附近库存折叠态-汇总件数与门店数">
<div class="imgcap">图 S2 · 附近库存折叠态（合计可售 + 门店数 + 最近距离）</div>
<p>点折叠条展开：列出<mark class="mark">各物理仓名称、库存件数、距客户距离</mark>，按距离就近排序；距离缺失的仓库排后显示「距离未知」。</p>
<img class="img" src="shots/s03_stock_nearby_expanded.png" alt="附近库存展开态-各仓名称库存距离">
<div class="imgcap">图 S3 · 附近库存展开（仓名 + 库存 + 距离，就近排序）</div>
<h3>纯虚拟变体 / 未开物理租户</h3>
<p>开启物理库存租户内的<mark class="mark">纯虚拟变体</mark>（未绑定任何物理仓）只显示虚拟库存数量，<mark class="mark">不出现附近库存面板</mark>（以「国信南山温泉节假日房间」为例显示「库存 30 件」）。未开启物理库存的租户展示与此一致——仅虚拟数量行。</p>
<img class="img" src="shots/s04_stock_virtual_no_nearby.png" alt="纯虚拟变体-仅库存数量行无附近库存">
<div class="imgcap">图 S4 · 纯虚拟变体：仅「库存 N 件」，无附近库存面板</div>
<div class="warn"><b>口径说明：</b>已售罄按 <code>saleableStock=0</code> 判定显示缺货态；详情页只读不改库存，库存修正走后台库存管理 / 对账入口。</div>`},
{book:'op', id:'op-20', title:'微信分享兜底：标题 / 描述 / 主图', html:`
<p class="lead">微信内转发商品详情页到好友或朋友圈时，分享卡片的<mark class="mark">标题 / 描述 / 主图</mark>各自按<mark class="mark">逐级兜底链</mark>取值：商品信息缺失时依次回退到店铺级配置，再回退到内置默认值，保证<mark class="mark">任何商品转发出去的分享卡片都完整可用</mark>（不会出现空白图 / 空描述 / 带 HTML 标签的乱码）。</p>
<h3>逐级兜底链</h3>
<div class="card"><b>标题</b>：商品名 → 店铺名 → 内置站点名。<br/><b>描述</b>：商品描述（<mark class="mark">自动过滤 HTML 标签</mark>，截取前 100 字）→ 店铺简介 → 内置推荐语。<br/><b>主图</b>：商品主图 → 商品相册首图 → <mark class="mark">店铺默认分享图</mark> → 内置默认图。</div>
<h3>配置入口：店铺默认分享图</h3>
<p>后台<mark class="mark">店铺信息</mark>页提供<mark class="mark">「默认分享图」</mark>配置单元：选择图片后点保存即持久化。商品<mark class="mark">无主图且无相册图</mark>时，微信转发使用此店级图片作为卡片主图；留空则回退内置默认图。</p>
<img class="img" src="shots/r16_share_default_cfg.png" alt="店铺信息页-默认分享图配置">
<div class="imgcap">图 R16 · 店铺信息页「默认分享图」配置（MediaPicker 选图保存）</div>
<h3>商品详情页分享效果</h3>
<p>以有主图商品转发为例：卡片用<mark class="mark">商品主图</mark>，描述为<mark class="mark">过滤 HTML 后的纯文本介绍</mark>。无图商品则自动落到店铺默认分享图或内置默认图。</p>
<img class="img" src="shots/r17_vshop_share.png" alt="youshop 商品详情分享兜底">
<div class="imgcap">图 R17 · youshop 商品详情页分享取值（主图 + 纯文本描述）</div>
<img class="img" src="shots/r18_nshop_share.png" alt="nshop 商品详情分享兜底">
<div class="imgcap">图 R18 · nshop 商品详情页分享取值（主图 + 纯文本描述）</div>
<div class="warn"><b>说明：</b>描述过滤对 <code>&lt;p&gt;/&lt;b&gt;/&lt;img&gt;</code> 等富文本一律剥离并解码实体，天然避免 HTML 乱码；分享动作本身由微信 JSSDK 触发，此处保证各取值的兜底完整性。</div>`},
{book:'op', id:'op-21', title:'首页「城市 · 配送」过滤与风格配置', html:`
<p class="lead">首页商品按<mark class="mark">当前城市 × 配送方式</mark>实时过滤：每个商品声明<mark class="mark">配送方式</mark>（仅邮寄 / 仅自提 / 两者均可，<code>deliveryMethods</code>）与<mark class="mark">服务城市</mark>（邮寄看 <code>serviceCities</code>，空 = 全城；自提看 <code>belongCity</code> 精确匹配）。未选择城市时不过滤。过滤条支持<mark class="mark">segmented（胶囊）/ tabs（下划线）</mark>两种版式，由店铺装修配置（<code>shopContent.filter</code>）控制。</p>
<h3>邮寄 / 自提切换（以北京为例）</h3>
<p>进入首页默认<mark class="mark">邮寄</mark>：自提-only 商品（温泉工作日门票，belongCity=长春）在「北京 · 邮寄」下自动隐藏，全国可寄的邮寄品正常展示。</p>
<img class="img" src="shots/f1_s1_home_beijing_mail.png" alt="首页-北京邮寄-自提only商品隐藏">
<div class="imgcap">图 F1 · 北京 · 邮寄：自提-only 商品隐藏，邮寄品可见</div>
<p>点击过滤条「自提」切换配送方式：北京无自提门店 → 商品列表<mark class="mark">空态</mark>，提示「当前城市/配送方式下暂无可用商品」。</p>
<img class="img" src="shots/f1_s2_home_beijing_pickup.png" alt="首页-北京自提-空态提示">
<div class="imgcap">图 F2 · 北京 · 自提：无自提门店 → 空态提示</div>
<h3>多语言（英文）</h3>
<p>切换英文（<code>/en</code>）后，过滤条按钮与空态文案自动翻译：<mark class="mark">Mail / Self Pickup</mark>、<mark class="mark">No products available for your city / delivery method</mark>。</p>
<img class="img" src="shots/f1_s3_home_en_pickup.png" alt="首页-英文-自提过滤与空态翻译">
<div class="imgcap">图 F3 · 英文首页：Self Pickup 过滤条 + 翻译空态</div>
<h3>正向切换（以长春为例）</h3>
<p>切换到长春并选「自提」：自提-only 商品（温泉工作日门票，belongCity=长春）出现，仅邮寄品（黄金珠宝）隐藏——城市与配送双重过滤双向成立。</p>
<img class="img" src="shots/f1_s4_home_changchun_pickup.png" alt="首页-长春自提-自提only商品出现">
<div class="imgcap">图 F4 · 长春 · 自提：自提-only 商品出现、仅邮寄品隐藏</div>
<h3>风格配置（segmented / tabs / 关闭）</h3>
<p>店铺装修配置 <code>shopContent.filter</code> 支持三档：<code>bar.variant="tabs"</code> 切换为下划线页签样式（激活项橙色下划线）；<code>enabled=false</code> 关闭过滤（无过滤条、商品全量展示）；默认配置为 segmented + 邮寄 + 开启。</p>
<img class="img" src="shots/f2_v1_tabs_style.png" alt="首页过滤条-tabs下划线版式">
<div class="imgcap">图 F5 · tabs 下划线版式（激活「邮寄」橙色下划线）</div>
<img class="img" src="shots/f2_v2_filter_disabled.png" alt="首页过滤条-关闭过滤全量展示">
<div class="imgcap">图 F6 · 关闭过滤：无过滤条、全量商品展示</div>
<div class="note"><b>配置说明：</b>过滤配置走五级合并（全局默认 → 全局配置 → 风格模板 → 店铺 <code>shopContent</code> → 页面内建默认），店铺未配置时回退全局默认（segmented + 邮寄 + 开启）。</div>`},
{book:'op', id:'op-22', title:'详情页配送口径切换 + 租户网点管理', html:`
<p class="lead">商品详情页新增<mark class="mark">「邮寄 / 自提」配送切换</mark>：库存数字随口径联动——<mark class="mark">邮寄 = 可发仓 + 虚拟可售</mark>、<mark class="mark">自提 = 可自提点合计</mark>。后台（web-admin）<mark class="mark">网点管理</mark>支持创建 / 编辑 / 删除租户物理网点，并为网点声明<mark class="mark">配送方式三态</mark>（仅邮寄 / 仅自提 / 两者，空 = 两者都支持）。</p>
<h3>详情页配送切换与库存口径</h3>
<p>双模式商品（配送方式未配置 = 两者都支持）在详情页显示切换条：默认<mark class="mark">邮寄</mark>，库存行显示「库存 N 件」（邮寄可发口径）。</p>
<img class="img" src="shots/f3_p1_detail_mail.png" alt="详情页-邮寄口径库存">
<div class="imgcap">图 F7 · 详情页默认邮寄：库存「库存 196 件」</div>
<p>点「自提」切换后，库存行切换为<mark class="mark">自提口径</mark>（自提点合计 + 「自提」语义标签）。单模式商品不显示切换条并强制到该口径。</p>
<img class="img" src="shots/f3_p2_detail_pickup.png" alt="详情页-自提口径库存">
<div class="imgcap">图 F8 · 切换自提：库存行切为自提口径</div>
<h3>网点管理（web-admin）</h3>
<p>入口：租户后台 → 网点管理。列表展示网点名称、仓库性质、配送方式与城市范围，右侧提供编辑 / 删除。</p>
<img class="img" src="shots/s05_locations_list.png" alt="网点管理-列表">
<div class="imgcap">图 F9 · 网点管理列表（名称 / 性质 / 配送方式 / 城市）</div>
<p>「新建网点」进入表单：填写网点名称、<mark class="mark">配送方式多选</mark>（邮寄 / 自提）、城市与坐标（坐标用于就近距离计算）。</p>
<img class="img" src="shots/s06_location_edit_form.png" alt="网点管理-新建表单">
<div class="imgcap">图 F10 · 新建网点表单（配送方式多选 + 城市 + 坐标）</div>
<img class="img" src="shots/s06b_location_form_filled.png" alt="网点管理-表单已填写">
<div class="imgcap">图 F11 · 表单填写完成（名称 / 配送方式 / 长春 / 坐标）</div>
<p>保存后返回列表，新网点即时出现；删除需弹层确认，删除后网点从列表移除。网点与商品配送过滤、库存分配查询同源（<code>deliveryMethods</code> 三态）。</p>
<img class="img" src="shots/s07_locations_with_item.png" alt="网点管理-保存后新网点出现在列表">
<div class="imgcap">图 F12 · 保存后新网点出现在列表</div>
<img class="img" src="shots/s08_locations_after_delete.png" alt="网点管理-删除后列表">
<div class="imgcap">图 F13 · 删除确认后网点从列表移除</div>
<div class="warn"><b>口径说明：</b>自提口径仅在租户开启物理库存时统计自提点合计；未开启时切自提仅显示可达性提示（「到店自提，库存以门店为准」）。</div>`},
{book:'op', id:'op-15', title:'商品专属优惠券（绑定商品 + 凭码兑换）', html:`
<p class="lead">优惠券支持<mark class="mark">绑定到指定商品（SKU）</mark>，详情页自动展示领券块；券模板可设置<mark class="mark">凭码兑换、仅限新客、有效天数</mark>等领取设置，买家在「我的券包」凭码兑换后，下单时<mark class="mark">仅绑定商品行享受折扣</mark>，非绑定商品行正常计价。</p>
<h3>券模板「领取设置」（web-admin）</h3>
<p>编辑券模板时，「领取设置」区可配置：<mark class="mark">凭码兑换</mark>（生成唯一兑换码，买家凭码领取）、<mark class="mark">仅限新客</mark>（有历史订单客户不可领）、<mark class="mark">有效天数</mark>（领后按天计过期）等；「领取设置」上方的「领取方式」决定是否公开展示。保存后 C 端立即生效。</p>
<img class="img" src="shots/d2_05_admin_coupon_edit.png" alt="券模板编辑-领取设置区">
<div class="imgcap">图 D5 · 券模板编辑：领取设置（凭码兑换 / 仅限新客 / 有效天数）</div>
<h3>商品页「商品专属券」绑定（web-admin）</h3>
<p>商品编辑页新增<mark class="mark">「商品专属券」区块</mark>：为商品选择模板并绑定，可指定<mark class="mark">适用规格（variantIds）</mark>、备注与排序。绑定后模板自动转为 SKU 范围；未指定规格 = 商品全部 SKU 可用。</p>
<img class="img" src="shots/d2_06_admin_product_bind.png" alt="商品编辑-商品专属券绑定">
<div class="imgcap">图 D6 · 商品编辑：商品专属券绑定（选模板 + 指定规格）</div>
<h3>C 端：详情页领券</h3>
<p>绑定商品详情页展示<mark class="mark">领券块</mark>（徽标 + 券名 + 门槛 + 领取按钮）。未领时显示「领取」，领取成功后按钮态切换为已领，买家可去「我的券包」查看。</p>
<img class="img" src="shots/d2_01_detail_coupon_block.png" alt="详情页-商品专属券领券块">
<div class="imgcap">图 D7 · 详情页领券块（商品专属券）</div>
<img class="img" src="shots/d2_02_detail_coupon_claimed.png" alt="详情页-领券成功状态">
<div class="imgcap">图 D8 · 领券成功后按钮态切换</div>
<h3>C 端：领券中心凭码兑换</h3>
<p>领券中心（我的券包内）提供<mark class="mark">凭码兑换</mark>入口：输入兑换码（如 <code>T2SKU08518</code>）点击兑换，校验通过后券即时入包。仅限新客的券，老客兑换会被拦截并提示。</p>
<img class="img" src="shots/d2_03_coupon_centre_redeem.png" alt="领券中心-凭码兑换入口">
<div class="imgcap">图 D9 · 领券中心凭码兑换入口</div>
<img class="img" src="shots/d2_04_redeem_success.png" alt="凭码兑换成功-券入包">
<div class="imgcap">图 D10 · 凭码兑换成功，券入包</div>
<h3>下单结算：仅绑定行折扣</h3>
<p>购物车同时含绑定商品与非绑定商品时，用券后<mark class="mark">折扣只作用于绑定商品行</mark>（如绑定行 88000×85%=74800），非绑定行 16800 正常计价不参与折扣——保证券不会误伤其他商品。</p>
<div class="warn"><b>使用提示：</b>① 商品绑定的券默认仅该商品 SKU 可用；② 「仅限新客」以本租户是否有历史有效订单判定；③ 模板被商品绑定时不可直接删除，须先解绑。</div>`},
{book:'op', id:'op-23', title:'库存单据操作手册（库存管理方式 / 采购 / 移库 / 盘库 / 出库 / 流水）', html:`
<p class="lead">库存单据是租户对<mark class="mark">物理仓库存</mark>做增减调整的入口，配合<mark class="mark">店铺信息页的「库存管理方式」开关</mark>使用。本节覆盖：库存管理方式的含义、采购入库 / 移库 / 盘库 / 手动出库四类单据的操作步骤，以及<mark class="mark">库存流水</mark>的查看方式。</p>
<h3>1. 库存管理方式（简单库存 / Odoo库存）</h3>
<p>入口：租户后台 → <mark class="mark">店铺信息</mark> → <mark class="mark">库存管理方式</mark>。两种模式：<mark class="mark">简单库存</mark>（默认）= 由平台 Vendure 库存体系承载，用本手册所述单据调整仓库库存；<mark class="mark">Odoo库存（预留）</mark> = 预留的第三方 ERP 对接位，当前为占位，选中后可在下方填选<mark class="mark">Odoo 地址 / API Key</mark>（均选填）。一般租户保持「简单库存」即可。</p>
<img class="img" src="shots/inv_shopinfo_toggle.png" alt="店铺信息-库存管理方式toggle">
<div class="imgcap">图 I1 · 店铺信息页「库存管理方式」：简单库存 / Odoo库存（预留）选择</div>
<h3>2. 采购入库（stock-doc/purchase）</h3>
<p>入口：后台 → 库存 → <mark class="mark">采购入库</mark>。用于向目标仓库补货入库。表单字段：</p>
<ol class="steps">
  <li><b>目标仓库 *</b>：选择本次入库的物理仓。</li>
  <li><b>变体 ID (variantId) *</b>：填写入库的商品变体 ID（数字，如 42）。</li>
  <li><b>采购数量 *</b>：入库数量，须大于 0。</li>
  <li><b>成本价（分）</b>：选填，单位分为币种最小单位。</li>
  <li>点底部<mark class="mark">「入库」</mark>提交，校验通过即写入库存流水。</li>
</ol>
<img class="img" src="shots/inv_purchase.png" alt="采购入库-表单">
<div class="imgcap">图 I2 · 采购入库页：目标仓库 + 变体 ID + 数量 + 成本价</div>
<h3>3. 移库（stock-doc/transfer）</h3>
<p>入口：后台 → 库存 → <mark class="mark">移库</mark>，用于在<mark class="mark">两个仓库之间调拨</mark>库存。字段：<mark class="mark">源仓库 *</mark>、<mark class="mark">目标仓库 *</mark>、<mark class="mark">变体 ID *</mark>、<mark class="mark">移库数量 *</mark>，点「移库」提交。</p>
<h3>4. 盘库（stock-doc/stocktake）</h3>
<p>入口：后台 → 库存 → <mark class="mark">盘库</mark>，用于<mark class="mark">以盘点实数为准覆盖库存</mark>。字段：<mark class="mark">盘库仓库 *</mark>、<mark class="mark">变体 ID *</mark>、<mark class="mark">实盘数量 (realQty) *</mark>（按此值覆盖该仓库这一变体的库存），点「盘库」提交。适合盘点修正差异。</p>
<h3>5. 手动出库（stock-doc/issue）</h3>
<p>入口：后台 → 库存 → <mark class="mark">手动出库</mark>，用于报损、领用等一般性出库。字段：<mark class="mark">源仓库 *</mark>、<mark class="mark">变体 ID *</mark>、<mark class="mark">出库数量 *</mark>，<mark class="mark">原因</mark>（选填，如 报损/领用），点「出库」提交。</p>
<h3>6. 库存流水（movements）</h3>
<p>入口：后台 → 库存 → <mark class="mark">库存流水</mark>。这里是上述单据与订单销售共同汇总的<mark class="mark">库存变动台账</mark>：每一条记录标注变体、仓库、变动方向与数量来源（采购/移库/盘库/出库/销售扣仓等），是核对库存与追溯记录的一站式视图。当前无变动时显示<mark class="mark">「暂无流水」</mark>空态。</p>
<img class="img" src="shots/inv_movements.png" alt="库存流水-台账">
<div class="imgcap">图 I3 · 库存流水页（空态：「暂无流水」）</div>
<div class="warn"><b>口径说明：</b>库存单据均针对<mark class="mark">物理仓</mark><code>onHand</code>增减；虚拟仓的可售库存由系统按绑定物理仓镜像或由平台商品端维护。新建仓库与物理仓性质在「网点管理」（op-22）中定义。</div>
<h3>7. 库存预警（低库存 / 缺货 + 批量生成采购入库单）</h3>
<p>入口：后台 → 库存 → <mark class="mark">库存预警</mark>。系统按阈值扫描各仓库库存，自动标记<mark class="mark">低库存（橙徽，≤ 阈值）</mark>与<mark class="mark">缺货（红徽，0 件）</mark>，并展示每个 SKU 的<mark class="mark">当前库存 / 阈值 / 缺货量</mark>。可按<mark class="mark">仓库</mark>与<mark class="mark">预警阈值</mark>筛选，低库存行带红色描边便于扫视。</p>
<img class="img" src="shots/inv_alert.png" alt="库存预警-低库存与缺货徽标">
<div class="imgcap">图 I4 · 库存预警（低库存橙徽 / 缺货红徽 / 阈值 / 缺货量 / 红色描边）</div>
<p>勾选需要补货的 SKU 后，底部出现<mark class="mark">「生成采购入库单 (N)」</mark>按钮：一键为所选商品创建采购入库草稿（携带目标仓库与缺货量建议），转「采购入库」页确认提交即可补货，无需逐个手工录入。</p>
<img class="img" src="shots/inv_alert_checked.png" alt="库存预警-勾选批量生成采购入库单">
<div class="imgcap">图 I5 · 库存预警（勾选 #1001 #1002 → 「生成采购入库单 (2)」批量补货）</div>`},
{book:'op', id:'op-24', title:'多仓拆分发货（预留单）', html:`
<p class="lead">物理仓多仓租户下单后自动生成<mark class="mark">预留单</mark>；发货时订单行可按仓库拆分，各仓分别生成独立发货单（各自快递/运单号）。本节覆盖预留单的查看与拆分发货操作。</p>
<h3>1. 查看预留单</h3>
<p>入口：后台 → 订单 → 发货（或多仓订单详情）。系统按订单行展示各仓库应发数量与状态（待分配/已分配/已完成）。</p>
<h3>2. 按仓库拆分发货</h3>
<p>预留单存在时，发货页中每个订单行按仓库分组（出现仓库选择器），可分配到多个仓库，提交后逐仓生成独立发货单；各仓 SALE 后预留明细自动核销。当前示例为<mark class="mark">无预留单/单仓视图</mark>：订单行直接显示可发数量与「＋/−」控件，不出现仓库选择器。</p>
<img class="img" src="shots/r15_reservation_ship.png" alt="发货页-单仓视图">
<div class="imgcap">图 R15 · 发货页（无预留单的单仓视图：可发数量/± 控件 + 快递公司 + 确认发货；预留单存在时此处按仓库分组出现仓库选择器）</div>
<h3>3. 对账</h3>
<p>预留单对账校验 Σ物理 − 虚拟 == Σ待发，偏差行会在预留单对账视图列出。</p>`},
{book:'op', id:'op-25', title:'订单列表多版式', html:`
<p class="lead">订单列表提供<mark class="mark">三套版式</mark>：经典 / 状态优先 / 按状态分组，顶部「版式」按钮可随时切换，选择会被记住（下次进入保持）。</p>
<h3>1. 经典版式</h3>
<p>现状的手机卡片 + 桌面表格，补齐配送方式全名与收货地址行。</p>
<img class="img" src="shots/order_classic.png" alt="订单列表经典版式">
<div class="imgcap">图 O1 · 经典版式（手机）</div>
<h3>2. 状态优先版式</h3>
<p>状态列/状态色前置，方便运维按状态快速扫描。</p>
<img class="img" src="shots/order_status_first.png" alt="订单列表状态优先版式">
<div class="imgcap">图 O2 · 状态优先版式（手机）</div>
<h3>3. 按状态分组版式</h3>
<p>手机按状态分组并显示组内小计；桌面左侧状态导航 + 右侧明细。</p>
<img class="img" src="shots/order_status_group.png" alt="订单列表按状态分组版式">
<div class="imgcap">图 O3 · 按状态分组版式（手机）</div>`},
{book:'op', id:'op-26', title:'风格模板库管理', html:`
<p class="lead">风格模板库支持<mark class="mark">版本历史/回滚</mark>、<mark class="mark">店铺引用可见性</mark>与<mark class="mark">合并预览</mark>（L1 全局配置→L2 模板→L3 店铺覆盖深合并），便于安全迭代店铺风格。</p>
<h3>1. 列表引用徽标</h3>
<p>模板列表行显示「引用 N 店」徽标；删除/停用被引用模板时会弹确认框并列出将回退的店铺。</p>
<img class="img" src="shots/tpl_list_badges.png" alt="模板列表引用徽标">
<div class="imgcap">图 T1 · 模板列表引用徽标</div>
<h3>2. 历史版本与回滚</h3>
<p>编辑弹层「历史版本」Tab 查看各版本快照（时间+备注），可预览 JSON 或一键回滚。</p>
<img class="img" src="shots/tpl_history.png" alt="模板历史版本">
<div class="imgcap">图 T2 · 历史版本 Tab</div>
<h3>3. 合并预览</h3>
<p>「合并预览」Tab 选择覆盖场景后生成最终合并 JSON，逐键标注来源 L1/L2/L3。</p>
<img class="img" src="shots/tpl_preview.png" alt="模板合并预览">
<div class="imgcap">图 T3 · 合并预览与键来源</div>
<h3>4. 删除/停用警示</h3>
<img class="img" src="shots/tpl_warn.png" alt="模板删除警示">
<div class="imgcap">图 T4 · 删除被引用模板的确认警示</div>`},
{book:'op', id:'op-27', title:'分销：关系与结算', html:`
<p class="lead">分销功能把买家变成推广员：买家通过邀请码推广成交后，按关系链累计收益并可提现。你可以在「分销」菜单查看关系与佣金结算。</p>
<h3>1. 分销关系</h3>
<p>在「分销 → 分销关系」页签查看推广员列表：等级、上级、邀请码、累计收益 / 可提现 / 冻结金额，数据按当前租户隔离。</p>
<div class="note"><b>口径：</b>「可提现」为已结算可提余额，「冻结」为在途 / 未结算金额。</div>
<h3>2. 佣金结算</h3>
<p>在「分销 → 佣金结算」页签按周期查看佣金明细与结算状态，确认后发起提现 / 打款。</p>
<div class="shot-box"><img class="img" src="shots/op27_distributors.png" alt="分销-关系与结算"><div class="imgcap">图 D1 · 分销关系与结算</div></div>`},
{book:'op', id:'op-28', title:'图片库（媒体资源）', html:`
<p class="lead">图片库是店铺的媒体资源中心：集中上传、管理与复用店铺图片，一次上传多处引用（Logo、分享图、自提点照片、商品图等）。</p>
<h3>1. 上传与管理</h3>
<p>打开「图片库」，点击上传选择本地图片；列表中可预览与删除，资源按当前租户隔离。</p>
<h3>2. 随处引用</h3>
<p>在店铺信息（Logo / 分享图）、自提点照片、商品图片等配置处，「从图片库选择」即可复用，无需重复上传。</p>
<div class="shot-box"><img class="img" src="shots/op28_media.png" alt="图片库-媒体资源"><div class="imgcap">图 M1 · 图片库</div></div>
<img class="img" src="shots/g2_f4_media_multi_sel.png" alt="图片库-多选与底部操作条">
<div class="imgcap">图 M2 · 图片库多选（点选 2 张以上图片 → 底部操作条：已选 N 张 · 复制 URL · 清空）</div>`},
{book:'op', id:'op-29', title:'数据看板（今日概览 / 近 7/30 趋势 / 销量榜 / 库存健康）', html:`
<p class="lead">数据看板汇总店铺经营数据：今日订单 / 销售额（已支付口径）与库存预警，并提供<mark class="mark">近 7 / 近 30 日</mark>销售趋势与品类销量排行。</p>
<h3>1. 今日概览</h3>
<p>顶部三张卡片：今日订单数、今日销售额（gmv，已支付口径，不含未完成 / 取消单）、库存预警数（库存 ≤ 5）。</p>
<h3>2. 时间维度切换（近 7 / 近 30）</h3>
<p>看板中部提供<mark class="mark">「近 7 天 / 近 30 天」</mark>分段切换，趋势图与销量 Top 榜随切换即时刷新，方便观察周度与月度经营走向。</p>
<h3>3. 销售趋势与销量 Top 榜</h3>
<p>双线折线图展示所选时间段的<mark class="mark">销售额（元，左轴）与订单数（单，右轴）</mark>。下方「销量 Top 榜」按品类排行，每行展示<mark class="mark">排名、品类、单数、销量（件数）与 GMV</mark>，销量列辅助备货判断。</p>
<h3>4. 库存健康卡</h3>
<p>底部「库存健康」卡片展示<mark class="mark">低库存数 / 缺货数 / 总 SKU 数</mark>三格。缺货与总 SKU 取自默认仓库的库存快照；<mark class="mark">当仓库无库存记录时显示「−」</mark>，属正常口径（前端不伪造 0），可结合「库存预警」（op-23）补齐数据后回看。</p>
<div class="note"><b>权限：</b>数据看板需要 ViewDashboard 权限；若提示权限不足，请在「成员管理 → 角色」为当前角色勾选该权限。</div>
<div class="shot-box"><img class="img" src="shots/ops5_dashboard.png" alt="数据看板-完整版"><div class="imgcap">图 K1 · 数据看板（近 7/近 30 切换 + 趋势双线 + TOP 榜含销量列 + 库存健康卡）</div></div>`},
{book:'op', id:'op-30', title:'POS 门店收银（收银员）', html:`
<p class="lead">门店收银面向线下当面收款场景：店员（租户「收银员」角色）输入核销码 / 订单号查询订单，确认金额后完成收款。系统已为每个租户内置「收银员」角色，租户管理员可将其分配给成员使用 POS。</p>
<h3>0. 内置角色：收银员</h3>
<p>每个租户开通后默认生成「<span class="mark mark-blue">收银员</span>」角色（权限含：订单·读、订单·改、收银/POS·POS 收银操作），租户管理员保留 <mark class="mark">POS 收银操作</mark> 权限，两者均可进入「门店收银」。在「<span class="mark mark-blue">角色管理</span>」页可查看 / 调整「收银员」角色，或在「人员管理」给成员分配该角色。</p>
<div class="shot-box"><img class="img" src="shots/pos20_roles.png" alt="角色管理-收银员与POS权限"><div class="imgcap">图 P0 · 角色管理（收银员角色；权限组含「收银/POS → POS 收银操作」）</div></div>
<h3>1. 查询订单</h3>
<p>在「门店收银」输入核销码或订单号查询，展示订单号、应付金额与待交付商品。</p>
<h3>2. 确认收款</h3>
<p>点击「<mark class="mark">确认收款</mark>」弹出确认框，核对订单号、应付金额与商品后确认，完成收款成交；售后 / 台账同步更新。</p>
<div class="note"><b>收款即台账：</b>POS 确认收款后，「收款台账」中出现对应记录，核销人即收款人，可直接导出对账。</div>
<div class="shot-box"><img class="img" src="shots/pos31_result.png" alt="POS-查单命中"><div class="imgcap">图 P1 · 门店收银（输入核销码 ATK6XM 命中订单）</div>
<img class="img" src="shots/pos32_confirm_modal.png" alt="POS-确认收款modal">
<div class="imgcap">图 P2 · 门店收银（点「确认收款」弹出核对确认框）</div></div>
<h3>3. 电子小票</h3>
<p>收款成功后自动弹出<mark class="mark">电子小票</mark>：展示<mark class="mark">店铺名、收银小票、订单号、收款时间、应付金额</mark>与<mark class="mark">商品明细</mark>（品名 × 数量 + 金额）。点<mark class="mark">「复制小票」</mark>一键复制纯文本小票（可粘贴到聊天 / 对账记录），点「完成」关闭。</p>
<img class="img" src="shots/ops5_pos_result.png" alt="POS-查单结果卡">
<div class="imgcap">图 P3 · 门店收银（输入核销码命中订单：应付金额 + 待交付商品）</div>
<img class="img" src="shots/ops5_pos_receipt.png" alt="POS-电子小票卡">
<div class="imgcap">图 P4 · 电子小票（t2 测试店铺 · 收银小票 · 订单号 ZP202609210001 · 应付 ¥88 · 商品明细 · 实收 ¥88 · 复制小票 / 完成）</div>`},
{book:'op', id:'op-31', title:'售后处理流程', html:`
<p class="lead">买家发起的退款 / 退货 / 换货申请统一在「<mark class="mark">售后处理</mark>」集中处理。</p>
<h3>入口与筛选</h3>
<p>在「订单 → 售后处理」页查看全部售后工单，顶部标签可按 <mark class="mark">全部 / 待处理 / 已退款 / 已拒绝</mark> 筛选。每个工单展示订单号、售后类型（仅退款 / 退货退款 / 换货）、退款金额、原因与状态。</p>
<div class="shot-box"><img class="img" src="shots/b3_aftersale_list.png" alt="售后处理-列表与状态筛选"><div class="imgcap">图 S1 · 售后处理列表（类型 / 金额 / 原因 / 状态）</div></div>
<h3>处理售后</h3>
<p>点击工单进入「售后详情」，查看类型、状态、退款金额、原因与时间。根据工单状态可执行对应操作：<mark class="mark">同意</mark>、<mark class="mark">拒绝</mark>（需填原因）、<mark class="mark">确认收货退款</mark>、<mark class="mark">执行退款</mark> 或 <mark class="mark">重试退款</mark>。</p>
<div class="shot-box"><img class="img" src="shots/b3_aftersale_detail.png" alt="售后详情-操作"><div class="imgcap">图 S2 · 售后详情（同意 / 拒绝 / 执行退款等操作）</div></div>
<div class="note"><b>提示：</b>没有售后申请时列表显示「暂无售后工单」，属正常。处理后成交金额与收款台账同步反映。</div>`},
{book:'op', id:'op-32', title:'配送设置（档案 · 方式 · 区域运费）', html:`
<p class="lead">配送由三层管理：<mark class="mark">配送方式</mark>（可启停的送达形式）→ <mark class="mark">配送档案</mark>（方式组合模板）→ <mark class="mark">区域与运费</mark>（按区域计费）。先配好方式，再在档案中引用。</p>
<h3>1. 配送档案</h3>
<p>「配送」下「配送档案」列出所有组合模板。带 <mark class="mark">全局</mark> 标签的系统档案仅超管可维护、不可编辑；自定义档案可 <mark class="mark">编辑 / 设为默认 / 删除</mark>。无档案时点「<mark class="mark">+ 新建配送档案</mark>」创建。</p>
<div class="shot-box"><img class="img" src="shots/b3_shipping_profile.png" alt="配送档案-列表"><div class="imgcap">图 D1 · 配送档案（全局锁定 / 自定义 / 默认）</div></div>
<h3>2. 配送方式</h3>
<p>「配送方式」页维护具体送达形式（如门店自提、自提点配送、快递）。每条方式可 <mark class="mark">启用 / 停用</mark>（仅启用中可被档案引用），并可编辑、删除。</p>
<div class="shot-box"><img class="img" src="shots/b3_shipping_methods.png" alt="配送方式-列表"><div class="imgcap">图 D2 · 配送方式（门店自提 / 自提点配送等，启用中）</div></div>
<h3>3. 区域与运费</h3>
<p>在配送方式内配置「区域与运费」，按配送区域（省市区）设定计费规则。未配置运费规则时列表为空，需新增运费模板。</p>
<div class="shot-box"><img class="img" src="shots/b3_shipping_methodconfig.png" alt="区域与运费-配置"><div class="imgcap">图 D3 · 区域与运费（新增运费模板入口）</div></div>
<div class="warn"><b>引用顺序：</b>先启用配送方式，才能在「配送档案」中引用它，否则档案不可选。</div>`},
{book:'op', id:'op-33', title:'支付设置（档案 · 支付方式）', html:`
<p class="lead">支付同样分两层：<mark class="mark">支付档案</mark>是收款配置的集合模板，<mark class="mark">支付方式</mark>是具体收款通道。</p>
<h3>1. 支付档案</h3>
<p>「支付」下的「支付档案」列出收款配置模板。无档案时点「<mark class="mark">+ 新建支付档案</mark>」创建；已建档案可启用 / 停用、编辑。</p>
<div class="shot-box"><img class="img" src="shots/b3_payment_profile.png" alt="支付档案-列表"><div class="imgcap">图 Y1 · 支付档案（新建入口与空态）</div></div>
<h3>2. 支付方式</h3>
<p>「支付方式」维护可用的收款通道，控制哪些支付入口开放给买家，并按需启停。</p>
<div class="shot-box"><img class="img" src="shots/b3_payment_methods.png" alt="支付方式-列表"><div class="imgcap">图 Y2 · 支付方式</div></div>`},
{book:'op', id:'op-34', title:'自提点管理', html:`
<p class="lead">「到店自提」的取货点统一在「<mark class="mark">自提点管理</mark>」维护，买家下单时可选择就近自提点。</p>
<h3>1. 自提点列表</h3>
<p>「配送」或「自提」下的自提点管理列出现有自提点，可新增、编辑、删除。</p>
<div class="shot-box"><img class="img" src="shots/b3_pickup_list.png" alt="自提点-列表"><div class="imgcap">图 E1 · 自提点列表</div></div>
<h3>2. 新增 / 编辑自提点</h3>
<p>在编辑表单维护名称与类型（必填）、联系人 / 联系电话 / 营业时间、所在地区与详细地址（省市区三级联动，完整地址自动拼接）、经纬度，并可用「<mark class="mark">高德地图选点</mark>」自动回填位置。</p>
<div class="shot-box"><img class="img" src="shots/b3_pickup_edit.png" alt="自提点-编辑表单"><div class="imgcap">图 E2 · 自提点编辑（地图选点自动回填）</div></div>`},
{book:'op', id:'op-35', title:'商品分类管理', html:`
<p class="lead">归类先于上架。<mark class="mark">分类</mark>是首页「分类导航」与「商品楼层」的数据来源，做好分类树再批量铺货。</p>
<p>「商品 → 分类管理」列出现有分类，支持 <mark class="mark">新建分类 / 重命名 / 删除</mark>，以及「<mark class="mark">归位映射</mark>」把分类重新对齐到系统标准映射。</p>
<div class="shot-box"><img class="img" src="shots/b3_categories.png" alt="分类管理-列表"><div class="imgcap">图 C1 · 分类管理（新建 / 重命名 / 归位 / 删除）</div></div>
<div class="warn"><b>提示：</b>删除分类前请确认其下已无在售商品，避免商品失去归类入口。</div>`},
{book:'op', id:'op-36', title:'店铺全局配置', html:`
<p class="lead">平台视角的底层兜底配置（<mark class="mark">L1 底层</mark>）：当模板或店铺级配置未覆盖时的默认值，对所有店铺生效。</p>
<p>在「全局配置」（平台）中，可切换 <mark class="mark">nshop 商城 / youshop 商城</mark> 两条线，编辑主题令牌（<mark class="mark">主色 primaryColor / 辅色 accentColor / 圆角 radius</mark>）与「各页默认配置」<code>defaults</code> JSON，完成后点「<mark class="mark">保存</mark>」。</p>
<div class="shot-box"><img class="img" src="shots/b3_global_config.png" alt="全局配置-L1底层"><div class="imgcap">图 G1 · 全局配置（L1 底层回退值）</div></div>`},
{book:'op', id:'op-37', title:'装修子页详解', html:`
<p class="lead">除首页外，多个子页面也有独立的装修入口，可单独配置版式与视觉。</p>
<table>
  <thead><tr><th>子页</th><th>说明</th></tr></thead>
  <tbody>
    <tr><td><b>主题风格</b></td><td>整体配色 / 风格的统一开关</td></tr>
    <tr><td><b>详情页装修</b></td><td>商品详情页的版式与展示</td></tr>
    <tr><td><b>分类页装修</b></td><td>商品分类落地的页面</td></tr>
    <tr><td><b>购物车页装修</b></td><td>购物车 / 结算引导</td></tr>
    <tr><td><b>我的页装修</b></td><td>「我的」个人中心版式</td></tr>
  </tbody>
</table>
<div class="shot-box"><img class="img" src="shots/b3_decorate_theme.png" alt="主题风格"><div class="imgcap">图 N1 · 主题风格</div></div>
<div class="shot-box"><img class="img" src="shots/b3_decorate_product.png" alt="详情页装修"><div class="imgcap">图 N2 · 详情页装修</div></div>
<div class="shot-box"><img class="img" src="shots/b3_decorate_category.png" alt="分类页装修"><div class="imgcap">图 N3 · 分类页装修</div></div>
<div class="shot-box"><img class="img" src="shots/b3_decorate_cart.png" alt="购物车页装修"><div class="imgcap">图 N4 · 购物车页装修</div></div>
<div class="shot-box"><img class="img" src="shots/b3_decorate_profile.png" alt="我的页装修"><div class="imgcap">图 N5 · 我的页装修</div></div>`},
{book:'mp', id:'mp-1', title:'概述', html:`
<p>本手册演示「<mark class="mark">商户创建 → 商品提交 → 平台审批 → 上架生效 → 真实下单拆单</mark>」的完整闭环流程。整个流程涉及两类角色，通过 4 个阶段协同完成：</p>
<table>
  <thead><tr><th>阶段</th><th>角色</th><th>操作内容</th><th>截图</th></tr></thead>
  <tbody>
    <tr><td>A</td><td>平台超管</td><td>创建商户租户、添加管理员、生成初始口令</td><td>m01~m07</td></tr>
    <tr><td>B</td><td>商户管理员</td><td>首次登录强制改密、创建商品、提交上架审核</td><td>m08~m14</td></tr>
    <tr><td>C</td><td>平台超管</td><td>在待审列表审批（通过/驳回）</td><td>c02~c05</td></tr>
    <tr><td>D</td><td>商户管理员</td><td>复看商品状态变为「已在默认站点上架」</td><td>d01</td></tr>
  </tbody>
</table>
<div class="note"><b>演示账号：</b>商户邮箱 <code>chendi-mobile@joho.cn</code>，商品「手工黄油曲奇礼盒」。全程截图由自动化测试驱动真实界面抓取（手机视口），所见即所得。</div>`},
{book:'mp', id:'mp-2', title:'前置条件', html:`
<ul>
  <li>平台超管账号可登录管理后台，具备「租户管理」「商品上架审批」菜单权限。</li>
  <li>默认商城（<code>default</code> 租户）已配置好配送档案、支付档案、分类与税率。</li>
  <li>商户提交商品时未配置配送/支付档案/分类将被校验拦截，需先创建这些基础档案。</li>
</ul>`},
{book:'mp', id:'mp-3', title:'流程总览', html:`
<div class="flow">
  <div class="fphase">阶段 A · 平台超管</div>
  <div class="frow"><span class="fnode primary">登录后台</span><span class="farrow">→</span><span class="fnode">租户管理</span><span class="farrow">→</span><span class="fnode">新建商户</span></div>
  <div class="frow"><span class="fnode">租户详情</span><span class="farrow">→</span><span class="fnode">添加管理员</span><span class="farrow">→</span><span class="fnode primary">生成初始口令</span></div>
  <div class="fphase">↓ 将初始口令转交商户</div>
  <div class="fphase">阶段 B · 商户管理员</div>
  <div class="frow"><span class="fnode">首次登录</span><span class="farrow">→</span><span class="fnode">强制改密</span><span class="farrow">→</span><span class="fnode">加商品</span><span class="farrow">→</span><span class="fnode primary">提交上架(待审)</span></div>
  <div class="fphase">↓ 平台收到待审通知</div>
  <div class="fphase">阶段 C · 平台超管</div>
  <div class="frow"><span class="fnode">商品上架审批</span><span class="farrow">→</span><span class="fnode">定位商品</span><span class="farrow">→</span><span class="fnode primary">通过(或驳回)</span></div>
  <div class="frow"><span class="fnode">状态流转</span><span class="farrow">→</span><span class="fnode primary">pending → approved</span></div>
  <div class="fphase">阶段 D · 商户复核</div>
  <div class="frow"><span class="fnode">商户复看</span><span class="farrow">→</span><span class="fnode primary">已在默认站点上架</span></div>
</div>`},
{book:'mp', id:'mp-4', title:'阶段 A：平台超管创建商户', html:`
<h3>A1 · 登录管理后台</h3>
<p>使用平台超管账号登录，进入「工作台」。登录页输入用户名与密码后点击登录。</p>
<img class="img" src="shots/m01_login.png" alt="登录页">
<div class="imgcap">图 A1 · 后台登录页</div>
<h3>A2 · 进入租户管理</h3>
<p>登录后从底部切入「我的」→ 平台管理入口进入租户列表。列表展示所有已创建的商户（含官方店与第三方商户）。</p>
<img class="img" src="shots/m02_tenants.png" alt="租户列表">
<div class="imgcap">图 A2 · 租户列表</div>
<h3>A3 · 新建商户租户</h3>
<p>点击「新建」弹出创建弹窗，填写商户名称（店名），系统为新商户分配独立信道（Channel）与租户编号。第三方商户默认 <code>isOfficial=false</code>。</p>
<img class="img" src="shots/m03_create_tenant_dialog.png" alt="新建租户弹窗">
<div class="imgcap">图 A3 · 新建租户弹窗</div>
<p>创建成功后，新商户出现在租户列表，并拥有独立的 <code>token</code>（用于 API 侧商户上下文隔离）。</p>
<img class="img" src="shots/m04_tenants_after_create.png" alt="创建后租户列表">
<div class="imgcap">图 A4 · 创建后有独立 token</div>
<h3>A4 · 添加管理员</h3>
<p>点击商户进入「租户详情」，默认展示「管理员 / 角色」页签。在「管理员授权」区点「添加管理员」，为该商户创建后台账号。</p>
<img class="img" src="shots/m05_tenant_detail_admins.png" alt="租户详情-管理员">
<div class="imgcap">图 A5 · 租户详情-管理员</div>
<p>填写管理员邮箱、姓名，并勾选角色权限。</p>
<img class="img" src="shots/m06_add_admin_dialog_filled.png" alt="添加管理员弹窗">
<img class="img" src="shots/m06b_role_pick.png" alt="角色选择">
<div class="imgcap">图 A6 · 添加管理员并勾选角色</div>
<h3>A5 · 领取初始口令</h3>
<p>创建成功后系统弹窗显示<mark class="mark">一次性初始口令</mark>，并提示「仅显示一次，请复制并转发给本人；首次登录后强制修改密码」。可「一键复制」后安全转交商户人员。</p>
<img class="img" src="shots/m07_initial_password.png" alt="初始口令弹窗">
<div class="imgcap">图 A7 · 一次性初始口令</div>
<div class="tip"><b>安全设计：</b>初始口令为随机强口令（≥12 位，含大小写/数字/符号），仅展示一次，首次登录强制改密。</div>`},
{book:'mp', id:'mp-5', title:'阶段 B：商户登录并提交商品', html:`
<h3>B1 · 首次登录、强制修改密码</h3>
<p>商户用邮箱与初始口令登录，系统判定需强制改密，引导进入「修改密码」页，保证账户安全闭环（提交会销毁会话，仅演示界面）。</p>
<img class="img" src="shots/m08_merchant_login_filled.png" alt="商户登录">
<img class="img" src="shots/m09_change_password.png" alt="改密页">
<img class="img" src="shots/m09b_change_password_filled.png" alt="改密页已填写">
<div class="imgcap">图 B1 · 首登强制改密</div>
<h3>B2 · 进入商户工作台</h3>
<p>改密后进入商户工作台（首页），可看到「加商品」「订单」等入口，顶部为当前操作店铺上下文。</p>
<img class="img" src="shots/m10_merchant_dashboard.png" alt="商户工作台">
<div class="imgcap">图 B2 · 商户工作台</div>
<h3>B2b · 工作台全景：租户标识与全量功能入口</h3>
<p>工作台顶部卡片显示当前操作店铺的<mark class="mark">店铺名称 + 编码</mark>（第二行「编码 t2 · 经营中」），切换租户后自动更新，方便在多店铺间明确当前上下文。</p>
<img class="img" src="shots/m15_merchant_dashboard_top.png" alt="工作台顶部-店铺名称与编码">
<div class="imgcap">图 B2b-1 · 工作台顶部显示店铺名称与编码</div>
<p>工作台按「商品 / 交易 / 履约 / 装修 / 营销 / 分销 / 系统 / 平台」分区铺开全量管理入口（同一数据源与侧边抽屉保持一致），平台管理区仅对持有相应角色权限者显示。各分区顶部为主功能入口（填充按钮），次要项为描边/纯文字入口。</p>
<img class="img" src="shots/m16_merchant_dashboard_full.png" alt="工作台全部分组入口">
<div class="imgcap">图 B2b-2 · 工作台全量功能分区入口</div>
<p>右上角「☰」打开侧边抽屉，按分区列出全部功能；内容超出时抽屉内部可独立滚动，底部的「退出登录 / 平台管理」等始终可滚动到可见。</p>
<img class="img" src="shots/m17_merchant_drawer.png" alt="侧边抽屉-底部可见">
<div class="imgcap">图 B2b-3 · 侧边抽屉（底部内容可滚动查看）</div>
<h3>B2c · 首页经营数据（今日销售额 / 待发货 / 库存预警）</h3>
<p>工作台顶部卡片下方的三格数据为<mark class="mark">实时统计</mark>，进入工作台时自动加载，<strong>始终以当前登录租户的数据为准</strong>：切换店铺后数字相应刷新，不同租户互不串扰。</p>
<ul>
  <li><b>今日销售额</b>：当日（今日 0 点起）下单订单的实收金额合计，展示格式为 <code>¥ + 两位小数</code>；今日暂无订单时显示 <code>¥0.00</code>。</li>
  <li><b>待发货</b>：状态为「待发货」（已付款、尚未发货）的订单数，口径与「订单 → 待发货」页签一致。</li>
  <li><b>库存预警</b>：当前租户下 <mark class="mark">可用库存 ≤ 5</mark> 的库存条数，便于提前补货。</li>
</ul>
<p>统计加载异常时对应格子显示「—」占位（不会误显示 0 假装有数据）；下拉刷新或切店再进入会重新拉取。</p>
<img class="img" src="shots/m18_merchant_dashboard_kpi.png" alt="首页经营数据 KPI">
<div class="imgcap">图 B2c · 首页经营数据（按当前租户实时统计）</div>
<h3>B3 · 新建商品</h3>
<p>点「加商品」进入商品列表（初始为空），再进入「新增商品」表单，填写名称、Slug、描述、价格、库存，并选择配送档案、支付档案、分类与商品图片。</p>
<img class="img" src="shots/m11_merchant_product_list_empty.png" alt="商户商品列表-空">
<img class="img" src="shots/m12_merchant_create_product_form.png" alt="新增商品表单">
<div class="imgcap">图 B3 · 新建商品（配送/支付/分类必选）</div>
<div class="warn"><b>注意：</b>表单中的「配送档案 / 支付档案 / 分类」为必选，与拆单、结算规则强相关。</div>
<p>创建成功后商品出现在「全部」列表，即进入「待审」状态。</p>
<img class="img" src="shots/m13_merchant_product_pending.png" alt="商品已创建-待审">
<div class="imgcap">图 B4 · 商品进入待审</div>
<h3>B4 · 提交上架到默认站点</h3>
<p>在商品操作区点击「提交上架到默认站点」，弹窗确认后状态由「待提交」变为「已提交，待审核」（<code>marketplaceStatus: pending</code>），等待平台审批。</p>
<img class="img" src="shots/m14_submit_confirm_modal.png" alt="提交上架确认">
<div class="imgcap">图 B5 · 提交上架确认</div>`},
{book:'mp', id:'mp-6', title:'阶段 C：平台超管审批商品', html:`
<h3>C1 · 进入「商品上架审批」</h3>
<p>平台超管在侧栏/工作台进入「商品上架审批」，页面列出所有<mark class="mark">待审商品</mark>，每条卡片显示商品名、状态徽标及「驳回 / 通过」两个操作按钮。</p>
<img class="img" src="shots/c02_pending_list.png" alt="待审商品列表">
<div class="imgcap">图 C1 · 待审商品列表</div>
<img class="img" src="shots/g2_f3_pending_category.png" alt="待审商品-平台分类行">
<div class="imgcap">图 C1a · 待审商品卡片（每张卡片显示「平台分类」行：待归类 / 已设置分类名）</div>
<h3>C2 · 定位目标商品</h3>
<p>在列表中找到本次提交的「手工黄油曲奇礼盒」（可结合提交时间核对），卡片展示清晰名称与「待审」徽标。</p>
<img class="img" src="shots/c03_found_card.png" alt="定位目标商品">
<div class="imgcap">图 C2 · 定位目标商品卡片</div>
<h3>C3 · 通过审批</h3>
<p>点击「通过」弹出确认弹窗，确认后即完成审批，商品从待审列表移除（<code>marketplaceStatus: approved</code>）。</p>
<img class="img" src="shots/c04_approve_modal.png" alt="通过-确认弹窗">
<img class="img" src="shots/c05_after_approve.png" alt="通过后列表刷新">
<div class="imgcap">图 C3 · 通过审批</div>
<div class="warn"><b>如需驳回：</b>点击「驳回」并填写必填的驳回原因，商品进入「已驳回」态并回显原因，商户可据此修正后再次提交。</div>`},
{book:'mp', id:'mp-7', title:'阶段 D：商户复看上架结果', html:`
<p>商户重新登录进入商品列表，目标商品状态已更新为「<mark class="mark">已在默认站点上架</mark>」，标识其可在默认商场完成销售。</p>
<img class="img" src="shots/d01_merchant_approved_product.png" alt="商户端-已在默认站点上架">
<div class="imgcap">图 D1 · 商户端已上架</div>
<p>至此，<mark class="mark">商户创建 → 商品提交 → 平台审批 → 上架生效</mark> 的完整流程验证通过。</p>`},
{book:'mp', id:'mp-8', title:'状态与规则说明', html:`
<table>
  <thead><tr><th>状态码(市场)</th><th>界面显示</th><th>含义</th></tr></thead>
  <tbody>
    <tr><td><code>null</code></td><td>待提交</td><td>商品尚未提交上架</td></tr>
    <tr><td><code>pending</code></td><td>已提交，待审核</td><td>已提交，等待平台审批</td></tr>
    <tr><td><code>approved</code></td><td>已在默认站点上架</td><td>审批通过，可在默认商城销售（独立店不受审批约束）</td></tr>
    <tr><td><code>rejected</code></td><td>已驳回</td><td>审批未通过，回显原因，可修正后重提</td></tr>
  </tbody>
</table>
<ul>
  <li><b>租户规则：</b>前 20 个租户预留官方自营；第 21+ 为第三方商户，其商品需经平台审批后方可在默认商城销售。</li>
  <li><b>审批权限：</b>仅平台超管可见「商品上架审批」入口并执行通过/驳回。</li>
</ul>`},
{book:'mp', id:'mp-9', title:'商家商品真实下单拆单验证（e2e）', html:`
<p>审核通过后，商家商品在默认商城即可被真实下单。本节验证在<mark class="mark">同一笔订单</mark>里，商家商品与普通商品因<mark class="mark">配送档案不同</mark>而自动分箱、按箱配送的拆单能力。</p>
<h3>拆单原理</h3>
<p>分箱以<mark class="mark">配送档案</mark>（<code>shippingProfileId</code>，见变体级 <code>customFields</code>）为唯一划分单元：</p>
<ul>
  <li>同一送达档案 → 合箱；跨档案 / 跨租户 → 分箱，零交集；</li>
  <li>未绑定档案的变体回退到当前租户<mark class="mark">默认配送档案</mark>并入其分组；</li>
  <li>前端按 <code>orderBoxes</code> 分箱结果，每箱单独选配送方式、生成独立的配送线（ShippingLine）。</li>
</ul>
<h3>场景数据</h3>
<table>
  <thead><tr><th>商品</th><th>绑定配送档案</th><th>配送方式</th><th>归属箱</th></tr></thead>
  <tbody>
    <tr><td>商家「手工黄油曲奇礼盒」(变体31)</td><td>8「拆单验证-自提点档案」</td><td>自提点配送</td><td>箱A</td></tr>
    <tr><td>商家「陈记手工蛋卷」(变体32)</td><td>未绑定 → 回退默认档案5</td><td>门店自提</td><td>箱B</td></tr>
  </tbody>
</table>
<h3>验证结果（订单 75 <code>YZWKW3Z6PW3R8AZD</code>）</h3>
<ol>
  <li><b>同单加购：</b>曲奇 + 蛋卷落入同一活动订单（此前「分开建单」实为会话 token 未持久化，非拆单问题）。</li>
  <li><b>分箱查询 <code>orderBoxes</code> 返回 2 箱：</b>
    <table>
      <thead><tr><th>boxKey</th><th>生效档案</th><th>落入行</th><th>可用配送</th><th>默认配送</th></tr></thead>
      <tbody>
        <tr><td><code>box:8</code></td><td>拆单验证-自提点档案</td><td>曲奇</td><td>自提点配送</td><td>自提点配送</td></tr>
        <tr><td><code>box:5</code></td><td>default默认配送档案</td><td>蛋卷</td><td>门店自提</td><td>门店自提</td></tr>
      </tbody>
    </table>
  </li>
  <li><b>按箱设配送：</b>对每箱调用 <code>setOrderBoxShippingMethod</code> 成功后，订单出现 <strong>2 条配送线</strong>：
    <pre><code>shippingLines:
  - id58  pickup-point-template  自提点配送  ← 箱A（商家曲奇）
  - id59  store-pickup           门店自提    ← 箱B（蛋卷）</code></pre>
  </li>
  <li><b>状态流转：</b>订单由 <code>AddingItems</code> 顺利推进到 <code>ArrangingPayment</code>。</li>
  <li><b>支付：</b>生成支付记录；余额支付因测试顾客<mark class="mark">钱包无余额</mark>返回 <code>PAYMENT_DECLINED_ERROR</code>（属支付网关余额问题，与分箱无关）。</li>
</ol>
<h3>结论</h3>
<p>商家商品在默认商城完成审批上架后，与普通商品<mark class="mark">同单加购即可自动按配送档案拆分为多个包裹</mark>，每个包裹独立配送、独立结算行，拆单能力闭环验证通过。</p>
<div class="note"><b>说明：</b>本节为 Shop API 层的地基验证（订单/分箱/配送线/状态流水）。结算页按箱展示配送的 UI 截图见前端联调记录。</div>`},
{book:'mp', id:'mp-10', title:'常见问题（FAQ）· 入驻审批', html:`
<details><summary>商户提交商品时报「配送档案/支付档案/分类」必选？</summary><p>请先在该商户后台为商品配置对应的配送档案、支付档案与分类；这些档案与拆单、结算规则强相关，属校验拦截而非异常。</p></details>

{book:'cx', id:'cx-1', title:'nshop 结账页中国本地化（cn 版式）', html:`
